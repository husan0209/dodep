name: CI - Go Affiliate Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/go/affiliate/**'
      - 'infra/helm/charts/affiliate/**'
      - 'libs/proto/affiliate/**'
      - '.github/workflows/ci-go-affiliate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/go/affiliate/**'
      - 'infra/helm/charts/affiliate/**'
      - 'libs/proto/affiliate/**'
      - '.github/workflows/ci-go-affiliate.yml'

env:
  # Must match the `go` directive in services/go/affiliate/go.mod.
  #
  # Pinned to a patch rather than a bare minor for two reasons:
  #   - a bare '1.26' resolves to the newest patch, so the build would silently
  #     change toolchain from one run to the next;
  #   - govulncheck attributes standard library vulnerabilities to the version
  #     in go.mod, not to the toolchain that happens to run it. On 'go 1.26.0'
  #     it reports 14 reachable stdlib CVEs (crypto/tls, net/url, encoding/asn1,
  #     ...); on 'go 1.26.8' it reports none.
  GO_VERSION: '1.26.8'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: opus-casino

jobs:
  lint:
    name: Lint Affiliate Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/affiliate/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # Pinned, and v2 specifically. The v1 line is built with go1.24 and refuses
      # to analyse a module whose go directive is newer:
      #   the Go language version (go1.24) used to build golangci-lint is lower
      #   than the targeted Go version (1.26.8)
      # so with GO_VERSION at 1.26.8 only a v2 build can lint this service.
      #
      # Installed with `go install` rather than golangci-lint-action so the
      # version under test is the one named here and nothing else: the action
      # re-resolves `version` and silently switches behaviour between majors.
      - name: Lint Affiliate Service
        working-directory: services/go/affiliate
        # The 1m default is not enough for a cold module cache on this
        # dependency set.
        run: golangci-lint run --timeout=10m ./...

      - name: Check gofmt
        run: |
          cd services/go/affiliate
          # gofmt rewrites CRLF to LF, so a CRLF checkout is reported as needing
          # formatting even when the code itself is clean. The service is stored
          # with LF for exactly this reason.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "❌ Files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go vet
        run: |
          cd services/go/affiliate
          go vet ./...

  test:
    name: Test Affiliate Service
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opus_casino_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/affiliate/go.sum

      - name: Test Affiliate Service
        run: |
          cd services/go/affiliate
          go test -v -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/opus_casino_test?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          APP_ENV: test

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/go/affiliate/coverage.out
          flags: affiliate
          name: affiliate-coverage

  security:
    name: Security Scan Affiliate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run govulncheck
        run: |
          # Pinned: `@latest` would let a new advisory database entry turn this
          # gate red without any change to the service.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          cd services/go/affiliate
          govulncheck ./...

  build:
    name: Build and Push Affiliate Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Affiliate Service
        uses: docker/build-push-action@v5
        with:
          context: services/go/affiliate
          file: infra/docker/Dockerfile.go
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/affiliate:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/affiliate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/affiliate:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-affiliate.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-affiliate.sarif'

  deploy-dev:
    name: Deploy Affiliate to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy Affiliate Service
        run: |
          helm upgrade --install affiliate infra/helm/charts/affiliate \
            --namespace platform-dev \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=available deployment/affiliate -n platform-dev --timeout=120s

          # Health checks (ports 8090 per CONVENTIONS.md)
          kubectl port-forward svc/affiliate 18090:8090 -n platform-dev &
          PF_PID=$!
          sleep 5
          curl -f http://localhost:18090/health
          curl -f http://localhost:18090/ready
          kill $PF_PID
