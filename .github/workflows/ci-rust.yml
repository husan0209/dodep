# CI/CD Pipeline для Rust сервисов
# Opus Casino - Betting Engine, Wallet Core, WebSocket Gateway

name: CI - Rust

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-rust.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  # Floor imposed by the committed lockfile; see the comment in ci.yaml
  # for the 1.75 / 1.78 / 1.85 / 1.88 evidence. Do not lower without
  # re-checking.
  RUST_VERSION: "1.88"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Lint
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One broken service must not hide the other two. With the default
      # fail-fast, a failing leg cancels the rest of the matrix and the run
      # reports CANCEL for services that may well be green, which reads as a
      # failure of code nobody touched.
      fail-fast: false
      matrix:
        service: [betting-engine, wallet-core, websocket-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          # Every crate's build.rs runs tonic-build/prost-build, which shells out
          # to protoc. The hosted runner image does not ship it, so without this
          # the job dies in the build script with
          #   Could not find `protoc`. If `protoc` is installed, try setting the
          #   `PROTOC` environment variable
          # before clippy ever runs. Same step as .github/workflows/ci.yaml.
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Run rustfmt
        working-directory: services/rust/${{ matrix.service }}
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: services/rust/${{ matrix.service }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ==========================================================================
  # Test
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One broken service must not hide the other two. With the default
      # fail-fast, a failing leg cancels the rest of the matrix and the run
      # reports CANCEL for services that may well be green, which reads as a
      # failure of code nobody touched.
      fail-fast: false
      matrix:
        service: [betting-engine, wallet-core, websocket-gateway]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          # protoc is required by the tonic-build/prost-build build scripts.
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Run unit tests
        working-directory: services/rust/${{ matrix.service }}
        run: cargo nextest run --lib

      - name: Run integration tests
        working-directory: services/rust/${{ matrix.service }}
        run: cargo nextest run --test '*'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: target/nextest/default/

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One broken service must not hide the other two. With the default
      # fail-fast, a failing leg cancels the rest of the matrix and the run
      # reports CANCEL for services that may well be green, which reads as a
      # failure of code nobody touched.
      fail-fast: false
      matrix:
        service: [betting-engine, wallet-core, websocket-gateway]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # `--locked` installs the tool with the dependency tree its own
      # Cargo.lock pins, instead of resolving the newest compatible versions.
      # Without it, `cargo install cargo-audit` picked up kstring 2.0.5, which
      # requires rustc 1.96, and the install step died before cargo-audit ever
      # ran:
      #
      #   rustc 1.88.0 is not supported by the following packages:
      #   kstring@2.0.5 requires rustc 1.96.0
      #   Try re-running `cargo install` with `--locked`
      #
      # The tool's MSRV then tracks the version we asked for, not whatever its
      # dependencies happen to require that week.
      - name: Install cargo-audit
        # Both a version and --locked: --locked keeps the tool's dependency
        # tree on what its own Cargo.lock pins, and the version pin keeps the
        # tool itself from drifting.
        run: cargo install cargo-audit --version 0.21.2 --locked

      - name: Run cargo audit
        # From the workspace root, not the member directory: Cargo.lock lives
        # in services/rust, so running this in services/rust/<service> found no
        # lockfile at all. `--deny warnings` also turns unmaintained/unsound
        # advisories into failures rather than notes.
        working-directory: services/rust
        run: cargo audit --deny warnings

      # cargo-deny is intentionally absent: there is no deny.toml anywhere in
      # the repository, so `cargo deny check` could only ever exit non-zero.
      # Reinstating it means adding services/rust/deny.toml first, which needs
      # an explicit licence allow-list - a policy decision for the maintainers.
      # cargo-audit above already covers advisories and needs no config.

  # ==========================================================================
  # Build
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, security]
    strategy:
      # One broken service must not hide the other two. With the default
      # fail-fast, a failing leg cancels the rest of the matrix and the run
      # reports CANCEL for services that may well be green, which reads as a
      # failure of code nobody touched.
      fail-fast: false
      matrix:
        service: [betting-engine, wallet-core, websocket-gateway]
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.rust
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            PROFILE=release

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  # ==========================================================================
  # Deploy to Dev
  # ==========================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
      url: https://dev.opus.casino
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to dev
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:sha-${{ github.sha }} \
            -n dev
        
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ matrix.service }} -n dev --timeout=300s

      - name: Run smoke tests
        run: |
          curl -f https://dev.opus.casino/health || exit 1
