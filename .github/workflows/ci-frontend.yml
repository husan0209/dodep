# Shared TypeScript library CI
#
# Scope note: this workflow previously ran `npm ci`, `npm run lint`,
# `npm run format -- --check` and `npx tsc --noEmit` from the REPOSITORY ROOT.
# The root package.json is an Nx wrapper and the repo contains no project.json
# files, so:
#   * `npm run lint`        -> `nx run-many --target=lint --all` with zero projects
#   * `npm run format`      -> `nx format:write`             with zero projects
#   * `npx tsc --noEmit`    -> tsc prints its help text and exits 1 (no tsconfig)
# Every job in this file therefore failed for reasons unrelated to any code.
#
# apps/web is already covered by ci-nextjs-web.yml and apps/admin by
# ci-admin-panel.yml, so this workflow now covers the one package nothing
# covered: libs/shared/typescript (@dod/shared), which apps/admin consumes.

name: CI - Shared TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - 'libs/shared/typescript/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'libs/shared/typescript/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-frontend.yml'

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/shared/typescript

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: libs/shared/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: libs/shared/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: libs/shared/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test