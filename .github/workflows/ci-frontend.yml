# CI для общего TypeScript-пакета @dod/shared
# Opus Casino
#
# Этот workflow раньше запускал npm/eslint/tsc из корня репозитория по путям
# apps/web/**, apps/admin/** и libs/shared/typescript/**. В корне лежит
# nx-обёртка (`npm run lint` -> `nx run-many --target=lint --all`), у которой нет
# ни nx.json, ни project.json, поэтому шаги падали сразу:
#   - `npx tsc --noEmit` в корне: tsc печатает справку и выходит с кодом 1,
#     потому что в корне нет tsconfig.json;
#   - `npm run format -- --check` в корне: prettier пытается распарсить Helm
#     шаблоны (infra/helm/**, там Go-шаблонизация) и tools/testing/load-test.js
#     и валится с SyntaxError.
#
# Реальные приложения уже покрыты отдельными workflow:
#   apps/web   -> ci-nextjs-web.yml
#   apps/admin -> ci-admin-panel.yml
# Поэтому здесь остаётся единственная не покрытая ничем область - общий пакет
# @dod/shared, который подключают apps/admin и мобильные клиенты.

name: CI - Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'libs/shared/typescript/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'libs/shared/typescript/**'
      - '.github/workflows/ci-frontend.yml'

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/shared/typescript

jobs:
  # ==========================================================================
  # Type check + unit tests
  # ==========================================================================
  shared-lib:
    name: Shared TS library
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: libs/shared/typescript/package-lock.json

      # Пакет публикуется в GitHub Packages и подключается из apps/admin, поэтому
      # lockfile обязателен: без него `npm ci` падает, и воспроизводимость
      # зависимостей не гарантирована.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # На момент написания в пакете нет закоммиченных тестов, поэтому
      # --passWithNoTests: джоб зелёный, но как только тесты появятся, флаг
      # начнёт проверять их находку, а не молча пропускать.
      # eslint-шаг намеренно отсутствует: в пакете нет закоммиченного ESLint
      # конфига, и `npm run lint` падает с "couldn't find a configuration file".
      - name: Unit tests
        run: npm test -- --ci --passWithNoTests