name: CI - Go Services (Casino & Notification)

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/go/casino/**'
      - 'services/go/notification/**'
      - 'libs/proto/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/go/casino/**'
      - 'services/go/notification/**'
      - 'libs/proto/**'

env:
  # Every module in the matrix declares `go >= 1.24`; 1.21 could not even load
  # a module graph ("go.mod requires go >= 1.24").
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: opus-casino

jobs:
  lint:
    name: Lint Go Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go/casino/go.sum
            services/go/notification/go.sum

      # golangci-lint-action@v3 installs v1, which is built with go1.24 and
      # cannot type-check a go 1.24+ module ("file requires newer Go version
      # go1.26"). v2.14.0 is built with go1.27. Pinned, not `latest`.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: services/go

      - name: Lint Casino Service
        run: |
          cd services/go/casino
          golangci-lint run --output.text.path=stdout

      - name: Lint Notification Service
        run: |
          cd services/go/notification
          golangci-lint run --output.text.path=stdout

  test:
    name: Test Go Services
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opus_casino_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go/casino/go.sum
            services/go/notification/go.sum

      # libs/proto/gen is gitignored, so a clean checkout has no stubs and
      # every service importing github.com/opus-casino/proto/gen/go/* cannot
      # compile. The previous step ran protoc by hand with source_relative
      # paths, which wrote the packages somewhere the go.mod replace directive
      # does not look; use the project's own pinned buf + make target instead.
      - name: Generate Proto files
        run: |
          BUF_VERSION=1.73.0
          curl -fsSL -o /tmp/buf.tar.gz \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/buf.tar.gz -C /tmp
          sudo install -m 0755 /tmp/buf/bin/buf /usr/local/bin/buf
          make -C libs/proto gen-go

      - name: Test Casino Service
        run: |
          cd services/go/casino
          go test -v -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/opus_casino_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Test Notification Service
        run: |
          cd services/go/notification
          go test -v -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/opus_casino_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Upload Casino Coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/go/casino/coverage.out
          flags: casino
          name: casino-coverage
          fail_ci_if_error: false

      - name: Upload Notification Coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/go/notification/coverage.out
          flags: notification
          name: notification-coverage
          fail_ci_if_error: false

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Casino Service
        uses: docker/build-push-action@v5
        with:
          context: services/go/casino
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/casino:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/casino:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: services/go/notification
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy Casino Service
        run: |
          helm upgrade --install casino infra/helm/charts/casino \
            --namespace platform-dev \
            --set image.tag=${{ github.sha }} \
            --set env=dev \
            --wait --timeout 5m

      - name: Deploy Notification Service
        run: |
          helm upgrade --install notification infra/helm/charts/notification \
            --namespace platform-dev \
            --set image.tag=${{ github.sha }} \
            --set env=dev \
            --wait --timeout 5m

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=available deployment/casino -n platform-dev --timeout=120s
          kubectl wait --for=condition=available deployment/notification -n platform-dev --timeout=120s

          # Health check
          curl -f https://dev-api.opus.casino/health
          curl -f https://dev-api.opus.casino/ready