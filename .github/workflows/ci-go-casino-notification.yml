name: CI - Go Services (Casino & Notification)

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/go/casino/**'
      - 'services/go/notification/**'
      - 'libs/proto/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/go/casino/**'
      - 'services/go/notification/**'
      - 'libs/proto/**'

env:
  GO_VERSION: '1.21'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: opus-casino

jobs:
  lint:
    name: Lint Go Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go/casino/go.mod
            services/go/notification/go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: services/go

      - name: Lint Casino Service
        run: |
          cd services/go/casino
          golangci-lint run ./...

      - name: Lint Notification Service
        run: |
          cd services/go/notification
          golangci-lint run ./...

  test:
    name: Test Go Services
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opus_casino_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            services/go/casino/go.mod
            services/go/notification/go.mod

      - name: Generate Proto files
        run: |
          cd libs/proto
          # Install protoc-gen-go
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          # Generate Go code from proto files
          protoc --go_out=. --go_opt=paths=source_relative \
                 --go-grpc_out=. --go-grpc_opt=paths=source_relative \
                 */v1/*.proto

      - name: Test Casino Service
        run: |
          cd services/go/casino
          go test -v -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/opus_casino_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Test Notification Service
        run: |
          cd services/go/notification
          go test -v -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/opus_casino_test?sslmode=disable
          REDIS_ADDR: localhost:6379

      - name: Upload Casino Coverage
        uses: codecov/codecov-action@v3
        with:
          files: services/go/casino/coverage.out
          flags: casino
          name: casino-coverage

      - name: Upload Notification Coverage
        uses: codecov/codecov-action@v3
        with:
          files: services/go/notification/coverage.out
          flags: notification
          name: notification-coverage

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Casino Service
        uses: docker/build-push-action@v5
        with:
          context: services/go/casino
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/casino:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/casino:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}

      - name: Build and push Notification Service
        uses: docker/build-push-action@v5
        with:
          context: services/go/notification
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}

      - name: Deploy Casino Service
        run: |
          helm upgrade --install casino infra/helm/charts/casino \
            --namespace platform-dev \
            --set image.tag=${{ github.sha }} \
            --set env=dev \
            --wait --timeout 5m

      - name: Deploy Notification Service
        run: |
          helm upgrade --install notification infra/helm/charts/notification \
            --namespace platform-dev \
            --set image.tag=${{ github.sha }} \
            --set env=dev \
            --wait --timeout 5m

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=available deployment/casino -n platform-dev --timeout=120s
          kubectl wait --for=condition=available deployment/notification -n platform-dev --timeout=120s
          
          # Health check
          curl -f https://dev-api.opus.casino/health
          curl -f https://dev-api.opus.casino/ready
