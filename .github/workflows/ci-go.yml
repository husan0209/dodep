# CI/CD Pipeline для Go сервисов
# Opus Casino - Auth, User, Payment, Bonus, Casino, Notification, KYC

name: CI - Go

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/go/**'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/ci-go.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/go/**'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/ci-go.yml'

env:
  # Pinned to a patch release, not a bare minor. Two reasons:
  #   - it must satisfy the highest `go` directive in the matrix (kyc is on
  #     1.26.0, bonus on 1.25.0 because its CVE-fixed pgx/grpc need >= 1.25);
  #   - a bare '1.26' resolves to whatever patch is newest, and services whose
  #     stdlib advisories are only fixed in a later patch then fail
  #     govulncheck/gosec non-deterministically. Verified on 1.26.8:
  #     govulncheck reports "No vulnerabilities found" for the bonus module.
  GO_VERSION: '1.26.8'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Protobuf stubs
  # ==========================================================================
  # libs/proto/gen is gitignored by design (libs/proto/.gitignore), so a clean
  # checkout has no generated Go stubs and every service that imports
  # github.com/opus-casino/proto/gen/go/* cannot be type-checked. gosec reports
  # it as "package has type errors, skipping SSA analysis" and exits non-zero,
  # which fails the security job for the whole matrix.
  protos:
    name: Generate Protobuf Stubs (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned, not "latest": remote plugin resolution must be reproducible
      # for a build gate. The release archive unpacks to buf/bin/buf.
      - name: Install buf (pinned)
        run: |
          BUF_VERSION=1.73.0
          curl -fsSL -o /tmp/buf.tar.gz \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/buf.tar.gz -C /tmp
          sudo install -m 0755 /tmp/buf/bin/buf /usr/local/bin/buf
          buf --version

      # The target documented in libs/proto/Makefile for local development.
      - name: Generate Go stubs
        run: make -C libs/proto gen-go

      - name: Assert the stubs exist
        run: |
          test -f libs/proto/gen/go/common/v1/money.pb.go
          test -d libs/proto/gen/go/wallet/v1
          test -d libs/proto/gen/go/bonus/v1

      - name: Upload generated stubs
        uses: actions/upload-artifact@v4
        with:
          name: proto-go-stubs
          path: libs/proto/gen/go
          retention-days: 1

  # ==========================================================================
  # Lint
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: protos
    strategy:
      # One broken service must not hide the verdict of the others: with the
      # default fail-fast a single failing job cancels the whole matrix, so the
      # remaining services never get a result at all.
      fail-fast: false
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/${{ matrix.service }}/go.sum

      - name: Download generated protobuf stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-go-stubs
          path: libs/proto/gen/go

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.0
          # Built from source with the job's Go toolchain on purpose. The
          # published v2.1.0 release binary is compiled with go1.24 and refuses
          # to analyse a module that declares `go 1.25`:
          #   Error: can't load config: the Go language version (go1.24) used to
          #   build golangci-lint is lower than the targeted Go version (1.25.0)
          install-mode: goinstall
          working-directory: services/go/${{ matrix.service }}

      - name: Run golangci-lint
        working-directory: services/go/${{ matrix.service }}
        run: golangci-lint run --output.text.path=stdout

  # ==========================================================================
  # Test
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: protos
    strategy:
      # One broken service must not hide the verdict of the others: with the
      # default fail-fast a single failing job cancels the whole matrix, so the
      # remaining services never get a result at all.
      fail-fast: false
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/go/${{ matrix.service }}/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Download generated protobuf stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-go-stubs
          path: libs/proto/gen/go

      - name: Run tests
        working-directory: services/go/${{ matrix.service }}
        run: gotestsum --format testname --junitfile junit.xml -- -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            junit.xml
            coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: services/go/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: protos
    strategy:
      # One broken service must not hide the verdict of the others: with the
      # default fail-fast a single failing job cancels the whole matrix, so the
      # remaining services never get a result at all.
      fail-fast: false
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Download generated protobuf stubs
        uses: actions/download-artifact@v4
        with:
          name: proto-go-stubs
          path: libs/proto/gen/go

      - name: Run gosec
        working-directory: services/go/${{ matrix.service }}
        run: gosec -fmt sarif -out results.sarif ./...

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/go/${{ matrix.service }}/results.sarif

      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for vulnerabilities
        working-directory: services/go/${{ matrix.service }}
        run: govulncheck ./...

  # ==========================================================================
  # Build
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, security]
    strategy:
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]
    
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.go
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERVICE_PATH=services/go/${{ matrix.service }}
            VERSION=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  # ==========================================================================
  # Deploy to Dev
  # ==========================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
      url: https://dev.opus.casino
    
    strategy:
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to dev
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:sha-${{ github.sha }} \
            -n dev
        
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ matrix.service }} -n dev --timeout=300s

      - name: Run smoke tests
        run: |
          curl -f https://dev.opus.casino/${{ matrix.service }}/health || exit 1
