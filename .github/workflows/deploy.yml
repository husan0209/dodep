# GitHub Actions Workflow для автоматического деплоя
# Opus Casino — CI/CD Pipeline

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # See ci.yaml: Cargo.lock is format version 4 and the highest MSRV among the
  # 580 locked packages is home 0.5.12 at 1.88.
  RUST_VERSION: '1.88'
  # Must satisfy the highest `go` directive in the tree (admin-bff is on 1.24.1).
  GO_VERSION: '1.26.8'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # dtolnay/rust-action has been deleted; dtolnay/rust-toolchain is the live
      # equivalent and takes the same inputs.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # golangci-lint is used below but was never installed, so the lint step
      # failed with "golangci-lint: command not found" once the Rust action
      # problem was out of the way.
      #
      # v2 because the v1 line is built with go1.24 and refuses to analyse a
      # module whose go directive is newer than that, which every service in
      # this tree now is. Pinned so a new major cannot change the result.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          npm install
          cd services/rust && cargo fetch
          cd ../go/auth && go mod download
          # Installed from pyproject, not requirements.txt. requirements.txt pins
          # pytest==8.0.0 together with pytest-asyncio==0.23.4, and that pair
          # cannot resolve ("pytest-asyncio 0.23.4 depends on pytest<8"), so this
          # step failed before it ran a single command. pyproject is the source of
          # truth and CI Pipeline already installs the service from it.
          cd ../../python/fraud-ml && pip install -e ".[dev]"

      - name: Run linters
        run: |
          npm run lint
          cd services/rust && cargo clippy -- -D warnings
          cd ../go/auth && golangci-lint run
          cd ../../python/fraud-ml && ruff check .

      - name: Run tests
        run: |
          npm run test
          cd services/rust && cargo test
          cd ../go/auth && go test ./...
          cd ../../python/fraud-ml && pytest

      - name: Build
        run: |
          npm run build
          cd services/rust && cargo build --release

  # ==========================================================================
  # Deploy to Vercel (Web Frontend)
  # ==========================================================================
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'

  # ==========================================================================
  # Deploy to Railway (Backend Services)
  # ==========================================================================
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service:
          - betting-engine
          - wallet-core
          - websocket-gateway
          - auth
          - payment
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: jaxxstorm/action-install-gh-release@v1.11.0
        with:
          repo: railwayapp/railway-cli
      
      - name: Login to Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Deploy service
        run: |
          cd services/rust/${{ matrix.service }}
          railway up --service=${{ matrix.service }} --detach

  # ==========================================================================
  # Deploy Admin Panel
  # ==========================================================================
  deploy-admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd apps/admin && npm install

      - name: Build
        run: cd apps/admin && npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./apps/admin
          vercel-args: '--prod'

  # ==========================================================================
  # Notify
  # ==========================================================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-web, deploy-backend, deploy-admin]
    if: always()

    env:
      # Hoisted to the job level on purpose: the `secrets` context is not
      # available in a step-level `if:`, so a Slack guard written against
      # `secrets.SLACK_WEBHOOK != ''` is always false and the step silently
      # never runs. Reading it from job env is the supported way.
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK != ''
        uses: 8398a7/action-slack@v3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status: ${{ job.status }}
            Web: ${{ needs.deploy-web.result }}
            Backend: ${{ needs.deploy-backend.result }}
            Admin: ${{ needs.deploy-admin.result }}

      - name: Notify Success
        if: success()
        run: |
          echo "Deployment successful"
          echo "Web: https://opus-casino.vercel.app"
          echo "Admin: https://admin.opus-casino.vercel.app"

      # Reports the outcome and stops. It used to `exit 1`, which turned this
      # notification job red on every PR: the deploy jobs are main-only, so on a
      # pull request they are all `skipped`, `needs.*.result` is not `success`,
      # and the workflow reported a deployment failure for a run that never
      # deployed anything. Failing here also meant the notify job could never
      # distinguish "the deploy failed" from "this job is the thing that failed".
      - name: Notify Failure
        if: failure()
        run: |
          echo "Deployment failed"
          echo "Web:    ${{ needs.deploy-web.result }}"
          echo "Backend: ${{ needs.deploy-backend.result }}"
          echo "Admin:  ${{ needs.deploy-admin.result }}"
          echo "Check GitHub Actions logs for details"
