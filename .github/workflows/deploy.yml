# GitHub Actions Workflow для автоматического деплоя
# Opus Casino — CI/CD Pipeline

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  GO_VERSION: '1.25'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Build and Test
  #
  # This is the pre-deploy gate for the artifacts the jobs below actually
  # publish: the Rust workspace, every Go service, apps/web and apps/admin.
  #
  # It deliberately does NOT re-run lint/tests. Those live in the dedicated
  # per-language workflows (ci-rust / ci-go / ci-python / ci-frontend) and are
  # enforced by branch protection; the previous version duplicated them with
  # commands that could not run at all (root `npm run lint` goes through nx,
  # which has no projects configured, and golangci-lint/ruff were never
  # installed in the job).
  # ==========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go services
        run: |
          set -euo pipefail
          for dir in services/go/*/; do
            echo "::group::go build ${dir}"
            (cd "${dir}" && go build ./...)
            echo "::endgroup::"
          done

      - name: Build Rust workspace
        run: |
          set -euo pipefail
          cd services/rust
          cargo build --release

      - name: Build web and admin
        run: |
          set -euo pipefail
          for app in web admin; do
            echo "::group::npm build apps/${app}"
            (cd "apps/${app}" && npm ci && npm run build)
            echo "::endgroup::"
          done

  # ==========================================================================
  # Deploy to Vercel (Web Frontend)
  # ==========================================================================
  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'

  # ==========================================================================
  # Deploy to Railway (Backend Services)
  # ==========================================================================
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service:
          - betting-engine
          - wallet-core
          - websocket-gateway
          - auth
          - payment
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: jaxxstorm/action-install-gh-release@v1.11.0
        with:
          repo: railwayapp/railway-cli
      
      - name: Login to Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Deploy service
        run: |
          cd services/rust/${{ matrix.service }}
          railway up --service=${{ matrix.service }} --detach

  # ==========================================================================
  # Deploy Admin Panel
  # ==========================================================================
  deploy-admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: cd apps/admin && npm install

      - name: Build
        run: cd apps/admin && npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./apps/admin
          vercel-args: '--prod'

  # ==========================================================================
  # Notify
  # ==========================================================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-web, deploy-backend, deploy-admin]
    if: always()

    # Секрет поднимаем на уровне job: step-level env недоступен в own `if`.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      # Slack-нотификация не должна ронять workflow, когда webhook не задан:
      # action-slack падает с "Specify secrets.SLACK_WEBHOOK_URL" на пустом секрете.
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment Status: ${{ job.status }}
            Web: ${{ needs.deploy-web.result }}
            Backend: ${{ needs.deploy-backend.result }}
            Admin: ${{ needs.deploy-admin.result }}

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Web: https://opus-casino.vercel.app"
          echo "Admin: https://admin.opus-casino.vercel.app"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check GitHub Actions logs for details"
          # Не роняем job: notify — это observability, а не проверка качества.
          # Иначе красный Deploy-чек маскирует реальную причину в build-and-test.
