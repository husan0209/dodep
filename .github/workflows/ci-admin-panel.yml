name: CI Admin Panel

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/ci-admin-panel.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/admin

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/dist
          retention-days: 1

  docker:
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip Docker push when REGISTRY_URL is not configured
        if: env.REGISTRY_URL == ''
        run: echo "REGISTRY_URL not configured, skipping Docker image push."
