name: e2e-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/e2e-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/e2e-web.yml"
  workflow_dispatch:

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (chromium + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check E2E suite (scoped, independent of app baseline)
        run: npx tsc --noEmit -p tsconfig.e2e.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3100

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: apps/web/e2e/test-results/junit.xml
          retention-days: 7
