name: CI Pipeline

on:
  # This workflow is the pre-split catch-all. Every job in it is duplicated, and
  # more strictly, by a path-filtered dedicated workflow:
  #   rust-build       -> ci-rust.yml
  #   go-build         -> ci-go.yml
  #   python-build     -> ci-python.yml, ci-python-fraud-ml.yml
  #   frontend-build   -> ci-nextjs-web.yml, ci-admin-panel.yml
  #   security-scan    -> security-scan.yml
  #   docker-build     -> cd.yaml / deploy.yml
  #
  # It carries no `paths:` filter, so on pull_request it built and tested the
  # entire monorepo regardless of what the PR touched. That made every PR pay
  # for pre-existing breakage in code it never modified: a Python-only change
  # was reported red because the Go modules on main could not resolve their
  # protobuf stubs and apps/admin had no committed ESLint config.
  #
  # PR gating therefore belongs to the path-filtered workflows, which verify the
  # code a PR actually changes. This file keeps producing release images on main,
  # where the full matrix still runs.
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 1.85 is the floor imposed by the committed lockfile, verified against
  # services/rust/Cargo.lock with cargo metadata --locked:
  #   1.75 -> lock file version `4` was found, but this version of Cargo does
  #           not understand this lock file   (lockfile v4 needs >= 1.78)
  #   1.78 -> feature `edition2024` is required, pulled in by cpufeatures
  #           0.3.0 via aes 0.9.0   (edition 2024 needs >= 1.85)
  #   1.85 -> resolves the whole workspace
  # Do not lower this without re-running that check.
  # The floor is 1.85; stable is used so the toolchain can only ever be
  # newer. fmt / clippy -D warnings / build --release / test --release were
  # all verified against current stable (1.94.x) for all three services.
  RUST_VERSION: "stable"
  # Must satisfy the highest `go` directive in services/go/*/go.mod (>= 1.24).
  GO_VERSION: "1.26"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # Rust services build and test
  rust-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [betting-engine, wallet-core, websocket-gateway]
    defaults:
      run:
        working-directory: services/rust/${{ matrix.service }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt, clippy
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev protobuf-compiler
    
    - name: Check format
      run: cargo fmt --all -- --check
    
    - name: Clippy linting
      run: cargo clippy -- -D warnings
    
    - name: Build
      run: cargo build --release
    
    - name: Run tests
      run: cargo test --release

  # Go services build and test
  go-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, user, payment, bonus, casino, notification, kyc]
    defaults:
      run:
        working-directory: services/go/${{ matrix.service }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
    
    # libs/proto/gen is gitignored, so a fresh checkout cannot compile any
    # service that imports github.com/opus-casino/proto/gen/go/*.
    # working-directory is pinned to the repo root: this job defaults every
    # `run` to services/go/${{ matrix.service }}, where `libs/proto` does not
    # resolve.
    - name: Install buf (pinned)
      working-directory: .
      run: |
        BUF_VERSION=1.73.0
        curl -fsSL -o /tmp/buf.tar.gz \
          "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64.tar.gz"
        sudo tar -xzf /tmp/buf.tar.gz -C /tmp
        sudo install -m 0755 /tmp/buf/bin/buf /usr/local/bin/buf
        make -C libs/proto gen-go

    - name: Download dependencies
      run: go mod download
    
    - name: Vet
      run: go vet ./...
    
    - name: Build
      run: go build -v ./...
    
    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: ${{ matrix.service }}

  # Python services build and test
  python-build:
    runs-on: ubuntu-latest
    strategy:
      # One broken service must not hide the other's result: the default
      # fail-fast cancels the analytics leg when fraud-ml fails, so the run
      # reports CANCEL for a service that may well be green.
      fail-fast: false
      matrix:
        service: [fraud-ml, analytics]
    defaults:
      run:
        working-directory: services/python/${{ matrix.service }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy src/
    
    - name: Test
      run: pytest -v --cov=src

  # Frontend build and test
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run build
    
    - name: Test
      # Plain pm run test\: -- --run is swallowed by npm >= 10 instead of
      # reaching the runner, and both apps already use non-watch scripts.
      run: npm run test

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: [rust-build, go-build, python-build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets

  # Docker build and push
  docker-build:
    runs-on: ubuntu-latest
    needs: [rust-build, go-build, python-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        include:
          - service: betting-engine
            context: services/rust
            dockerfile: infra/docker/Dockerfile.betting-engine
          - service: wallet-core
            context: services/rust
            dockerfile: infra/docker/Dockerfile.wallet-core
          - service: auth
            context: services/go/auth
            dockerfile: infra/docker/Dockerfile.auth
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: |
          ghcr.io/opus-casino/${{ matrix.service }}:${{ github.sha }}
          ghcr.io/opus-casino/${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
