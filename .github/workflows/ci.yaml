name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Floor imposed by the committed lockfile (services/rust/Cargo.lock). Every
  # `rust-version` declared by a locked crate has to be <= this:
  #   home 0.5.12                 -> 1.88
  #   wit-bindgen* / wasip2/3     -> 1.87
  #   icu_* 2.2.0                 -> 1.86
  #   unicode-segmentation 1.13.2 -> 1.85
  # At 1.85 cargo refuses the graph with
  #   "rustc 1.85.1 is not supported by the following packages:
  #    icu_properties_data@2.2.0 requires rustc 1.86"
  # which is what the rust-build matrix reported. Do not lower this without
  # re-checking every rust-version in the lockfile.
  RUST_VERSION: "1.88"
  GO_VERSION: "1.21"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"