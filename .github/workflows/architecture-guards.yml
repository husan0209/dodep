name: Architecture Guards

# Архитектурные проверки для Opus Casino (dodep).
# Проверяет инварианты микросервисной гемблинг-платформы:
# 1. Деньги: запрет float для финансовых расчетов
# 2. Логирование: запрет println! / fmt.Println в продакшене
# 3. Безопасность: запрет захардкоженных секретов
# 4. Код: запрет @ts-ignore без объяснений

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────────────────────
      # G1: Запрет float типов для денег в критических сервисах
      # В гемблинге балансы — только Decimal или целые (cents/satoshi)
      # ──────────────────────────────────────────────────────────────
      - name: "G1: No float money fields in wallet services"
        run: |
          echo "Проверка G1: отсутствие float в финансовых структурах wallet..."
          FAIL=0
          if grep -rnE "balance.*(f32|f64)" services/rust/wallet-core/src/ 2>/dev/null; then
            echo "❌ Найдено использование f32/f64 для баланса в wallet-core!"
            FAIL=1
          fi
          if grep -rnE "balance.*(float32|float64)" services/go/payment/ 2>/dev/null; then
            echo "❌ Найдено использование float32/float64 для баланса в payment service!"
            FAIL=1
          fi
          if [ $FAIL -eq 1 ]; then
            echo "Используйте целые числа (cents/satoshi) или Decimal!"
            exit 1
          fi
          echo "✅ G1 пройден: float для денег отсутствует."

      # ──────────────────────────────────────────────────────────────
      # G2: Запрет неструктурированного логирования в Go / Rust
      # ──────────────────────────────────────────────────────────────
      - name: "G2: No raw println/fmt.Println in core services"
        run: |
          echo "Проверка G2: отсутствие сырых принтов в core сервисах..."
          # Scope: long-running service code only.
          #   - _test.go  : test output is expected
          #   - /cmd/     : CLI entrypoints (migrate, seed, genhash) — printing
          #                 to stdout IS their interface; they run once and exit
          # Service packages (main.go, internal/**) must use zap/slog instead.
          VIOLATIONS=$(grep -rn "fmt\.Println(" services/go/ 2>/dev/null \
            | grep -v "_test\.go" \
            | grep -v "/cmd/" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Найдены fmt.Println в сервисном коде Go:"
            echo "$VIOLATIONS"
            echo "Используйте структурированное логирование (zap/slog)."
            exit 1
          fi
          echo "✅ G2 пройден: fmt.Println только в тестах и CLI (cmd/)."

      # ──────────────────────────────────────────────────────────────
      # G3: Запрет захардкоженных секретов
      # ──────────────────────────────────────────────────────────────
      - name: "G3: No hardcoded secrets or private keys"
        run: |
          echo "Проверка G3: отсутствие захардкоженных приватных ключей..."
          # Scope: project code only. The marker strings also appear in
          # bundled agent-skill docs (.claude/, .qwen/, …) as redacted
          # Kubernetes examples — those are vendored, not project secrets.
          # Prune with a plain `grep -v -E` on the path prefix.
          FOUND=0
          for MARKER in "BEGIN RSA PRIVATE KEY" "BEGIN OPENSSH PRIVATE KEY"; do
            HITS=$(git grep -n "$MARKER" -- \
              'apps' 'services' 'libs' 'infra' 'docs' 'tools' 'gen' 2>/dev/null \
              | grep -v -E '^tools/guards/architecture_guards\.py:' || true)
            if [ -n "$HITS" ]; then
              echo "❌ Обнаружен приватный ключ ($MARKER):"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "Ключи должны приходить из Vault / переменных окружения."
            exit 1
          fi
          echo "✅ G3 пройден: приватные ключи не обнаружены."

      # ──────────────────────────────────────────────────────────────
      # G4: Запрет отключения проверок типов @ts-ignore во фронтенде
      # ──────────────────────────────────────────────────────────────
      - name: "G4: No unsuppressed @ts-ignore / eslint-disable in frontend"
        run: |
          echo "Проверка G4: подавление проверок во фронтенде..."
          # @ts-ignore/@ts-nocheck defeat the type checker, eslint-disable
          # defeats the linter — including directives for rules that are not
          # even enabled (they rot silently). Both are forbidden.
          SUPPRESSIONS=$(git grep -nE "@ts-ignore|@ts-nocheck|eslint-disable" -- \
            'apps' 'libs' 2>/dev/null || true)
          if [ -n "$SUPPRESSIONS" ]; then
            echo "❌ Найдены suppression-директивы. Используйте строгую типизацию:"
            echo "$SUPPRESSIONS"
            exit 1
          fi
          echo "✅ G4 пройден: @ts-ignore / eslint-disable отсутствуют."

      # ──────────────────────────────────────────────────────────────
      # Локальный запуск: py tools/guards/architecture_guards.py
      # Правила G1–G4 дублируются там, чтобы можно было проверять
      # инварианты без пуша. Держите оба места в синхроне.
      # ──────────────────────────────────────────────────────────────
      - name: "Summary"
        run: |
          echo "🎉 Все архитектурные проверки (G1–G4) пройдены успешно!"
