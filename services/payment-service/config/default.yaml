# Payment Service - Default Configuration
# This file contains default values for all environments

environment: development

server:
  port: 8080
  read_timeout_sec: 10
  write_timeout_sec: 10
  idle_timeout_sec: 60

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  database: payment_service
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_sec: 300

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100

kafka:
  brokers:
    - localhost:9092
  topic_prefix: payments
  acks: all
  compression: snappy
  retry_max: 3
  retry_backoff_ms: 100

nowpayments:
  base_url: https://api.nowpayments.io/v1
  api_key: ""  # Set via PAYMENT_NOWPAYMENTS_API_KEY env var
  ipn_secret: ""  # Set via PAYMENT_NOWPAYMENTS_IPN_SECRET env var
  timeout: 30s
  max_retries: 3
  retry_delay: 1s

wallet:
  address: localhost:50051
  timeout: 5s
  enable_tls: false
  max_recv_msg_size: 4194304  # 4MB
  max_send_msg_size: 4194304  # 4MB

user:
  address: localhost:50052
  timeout: 5s
  enable_tls: false
  max_recv_msg_size: 4194304  # 4MB
  max_send_msg_size: 4194304  # 4MB
