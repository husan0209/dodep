[project]
name = "fraud-ml"
version = "1.0.0"
description = "Fraud Detection ML Service for Opus Casino"
requires-python = ">=3.11"

# Pins are exact and must stay identical to requirements.txt.
# CI has two install paths: `pip install -r requirements.txt`
# (ci-python-fraud-ml.yml) and `pip install -e ".[dev]"` (ci.yaml).
# Open ranges made the second path resolve bleeding-edge versions
# (starlette/pandas/numpy majors), which broke the test suite in ways the
# pinned path never saw. tests/test_dependencies.py enforces the match.
dependencies = [
    # Data Processing
    "polars==0.20.3",
    "pandas==2.2.0",
    "numpy==1.26.3",

    # ML
    "xgboost==2.0.3",
    "scikit-learn==1.5.2",

    # Model Export (onnxmltools provides the native XGBoost converter;
    # skl2onnx cannot convert XGBClassifier)
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
    "onnxmltools==1.16.0",

    # Database / streaming
    "clickhouse-connect==0.7.1",
    "confluent-kafka==2.8.2",

    # API
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.0",

    # Configuration
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",

    # Logging
    "structlog==24.1.0",

    # Monitoring
    "prometheus-client==0.20.0",

    # Utils
    "python-dotenv==1.2.4",
    "joblib==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    # Required by fastapi.testclient (TestClient) for the API tests.
    "httpx==0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
# Tests legitimately use assert and fake credentials; scanning them only
# buries real findings.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
