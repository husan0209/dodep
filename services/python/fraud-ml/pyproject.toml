[project]
name = "fraud-ml"
version = "1.0.0"
description = "Fraud Detection ML Service for Opus Casino"
requires-python = ">=3.11"

dependencies = [
    # Data Processing
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    
    # ML
    # Not capped. xgboost 2.x is not an option: its save_model() reads
    # `self._estimator_type`, which scikit-learn removed in 1.9, so every
    # FraudModel.save() fails with
    #   TypeError: `_estimator_type` undefined. Please use appropriate mixin to
    #   define estimator type.
    # ONNX export is the one thing 3.x cannot do here -- onnxmltools has no shape
    # calculator for it -- so tests/test_export.py skips with the version named
    # rather than failing the build.
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    
    # Model Export
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "skl2onnx>=1.17.0",
    # Supplies the XGBoost shape calculator and converter that skl2onnx needs.
    # Without it, export_onnx() cannot convert an XGBClassifier at all.
    "onnxmltools>=1.16.0",
    
    # Database
    "clickhouse-connect>=0.7.1",
    "sqlalchemy>=2.0.25",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Configuration
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    
    # Logging
    "structlog>=24.1.0",
    
    # Monitoring
    "prometheus-client>=0.20.0",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# N803/N806 flag `X` and `X_scaled`. That is the scikit-learn/pandas convention
# for a design matrix and renaming it to `x` would make this code read worse than
# the lint rule helps; it is also what every tutorial and API doc for these
# libraries uses. Suppressed per file rather than globally, so a genuine
# mis-cased name elsewhere is still reported.
"internal/models/fraud_detector.py" = ["N803", "N806"]
"src/models/fraud_model.py" = ["N803", "N806"]
"tests/test_models.py" = ["N806"]
# Long lines here are ClickHouse SQL text. Wrapping them would either change the
# query or need implicit string concatenation inside a triple-quoted block, so
# the individual lines carry `# noqa: E501` instead.
"internal/repository/clickhouse_repository.py" = ["E501"]
"src/data/clickhouse.py" = ["E501"]
"src/features/extraction.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
