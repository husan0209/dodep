[project]
name = "fraud-ml"
version = "1.0.0"
description = "Fraud Detection ML Service for Opus Casino"
requires-python = ">=3.11"

dependencies = [
    # Data Processing
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    
    # ML
    # Upper bound on xgboost: skl2onnx has no shape calculator for
    # xgboost >= 3.0, so ONNX export raises MissingShapeCalculator with the
    # 3.x sklearn wrapper (tests/test_export.py).
    "xgboost>=2.0.3,<3.0.0",
    "scikit-learn>=1.4.0,<1.8",
    "imbalanced-learn>=0.12.0",
    
    # Model Export
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "skl2onnx>=1.17.0",
    # onnxmltools carries the XGBoost converter; skl2onnx dropped
    # skl2onnx.xgboost, so ONNX export needs this explicitly.
    "onnxmltools>=1.12.0",
    
    # Database
    "clickhouse-connect>=0.7.1",
    "sqlalchemy>=2.0.25",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Configuration
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    
    # Logging
    "structlog>=24.1.0",
    
    # Monitoring
    "prometheus-client>=0.20.0",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    # scikit-learn / numpy convention: `X` / `y` for feature matrices and
    # targets. N803/N806 flag these as non-lowercase, but renaming them would
    # break the correspondence with the model APIs and the surrounding docs.
    "N803",
    "N806",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
