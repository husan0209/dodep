[project]
name = "fraud-ml"
version = "1.0.0"
description = "Fraud Detection ML Service for Opus Casino"
requires-python = ">=3.11"

dependencies = [
    # Data Processing
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    
    # ML
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.0",
    "imbalanced-learn>=0.12.0",
    
    # Model Export
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "skl2onnx>=1.17.0",
    # Tree converters for XGBoost. skl2onnx dropped them in 1.20, so
    # FraudModel.export_onnx cannot convert an XGBClassifier without this.
    "onnxmltools>=1.14.0",
    
    # Database
    "clickhouse-connect>=0.7.1",
    "sqlalchemy>=2.0.25",
    
    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Configuration
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    
    # Logging
    "structlog>=24.1.0",
    
    # Monitoring
    "prometheus-client>=0.20.0",
    
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# X, X_scaled, X_train and friends are the conventional names for a design
# matrix - in this codebase and in the scikit-learn / XGBoost estimators these
# modules wrap. N803/N806 would force a lowercase `x`, which reads like a typo
# next to every estimator it gets passed to, so they are relaxed for the model
# modules only. Every other module is held to the default.
"internal/models/fraud_detector.py" = ["N803", "N806"]
"src/models/fraud_model.py" = ["N803", "N806"]
"tests/test_models.py" = ["N803", "N806"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
