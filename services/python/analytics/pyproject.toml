[project]
name = "analytics"
version = "0.1.0"
description = "Analytics pipelines and reporting for Opus Casino platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "clickhouse-connect>=0.7.0",
    "redis>=5.0.0",
    "confluent-kafka>=2.3.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "apache-airflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    # ci.yaml's python-build job runs `pytest -v --cov=src` after installing
    # only the [dev] extra, so pytest-cov has to be reachable from here or the
    # job dies with "unrecognized arguments: --cov=src".
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    # Required by fastapi.testclient (TestClient) for the endpoint tests.
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

# Tool configuration mirrors services/python/fraud-ml so both Python services
# behave identically. Without an explicit `select`, ruff falls back to its
# defaults, which change between releases: a ruff upgrade added DTZ/PYI/FURB
# rules and turned a service red with no code change at all. Pinning the rule
# set makes that impossible.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.isort]
# The tests import the service through its `src` package
# (`from src.analytics.main import app`). Declaring it keeps the isort grouping
# deterministic instead of depending on whether ruff happens to sniff `src/` as
# first-party, which changes the expected blank line and fails I001.
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# ci-python.yml's lint job installs ruff/black/mypy only - never the service's
# own requirements - so fastapi, pydantic-settings and clickhouse_connect have
# no stubs on the runner. Without this, `mypy .` fails with
# "Cannot find implementation or library stub for module named fastapi".
ignore_missing_imports = true

[tool.bandit]
# B101 (assert_used) is not a vulnerability and a pytest suite cannot use
# anything else, so the test tree is excluded rather than the linter being
# pointed at src/ only - that would also skip internal/ and main.py, which
# is where the request handling and the Kafka consumer actually live.
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
# The service root holds `src/`, and the tests import through it
# (`from src.analytics.main import app`). CI invokes the `pytest` console
# script, which does not put the invocation directory on sys.path, so this has
# to be declared rather than inherited.
pythonpath = ["."]
