# Payment Service - Production Configuration
# Override values for production environment

environment: production

server:
  port: 8084
  read_timeout_sec: 10
  write_timeout_sec: 10
  idle_timeout_sec: 60

database:
  ssl_mode: require
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_sec: 600

redis:
  pool_size: 200

kafka:
  acks: all
  compression: snappy
  retry_max: 5
  retry_backoff_ms: 200

nowpayments:
  base_url: https://api.nowpayments.io/v1
  timeout: 30s
  retry:
    max_retries: 3
    initial_backoff: 100ms
    max_backoff: 5s
    backoff_factor: 2.0

wallet:
  enable_tls: true
  timeout: 5s

user:
  enable_tls: true
  timeout: 5s

tracing:
  enabled: true
  endpoint: otel-collector:4317
  protocol: grpc
  sample_rate: 0.1
  insecure: false
  service_name: payment-service
