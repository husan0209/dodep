[workspace]
resolver = "2"
members = [
    "betting-engine",
    "wallet-core",
    "websocket-gateway",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }

# gRPC
tonic = { version = "0.11", features = ["gzip"] }
prost = "0.12"
tonic-build = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "rust_decimal", "json"] }

# Cache (Redis API — compatible with DragonflyDB)
fred = { version = "9.0", features = ["enable-rustls"] }

# Message broker
rdkafka = { version = "0.36", features = ["tokio"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utils
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
validator = { version = "0.18", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
rand = "0.8"
bytes = "1.7"

# JWT (Ed25519 / EdDSA)
jwt-simple = "0.12"
base64 = "0.22"

# Metrics
metrics = "0.22"

# Testing
tokio-test = "0.4"
testcontainers = "0.15"
