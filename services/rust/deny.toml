# cargo-deny configuration for the services/rust workspace.

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
