[package]
name = "opus-shared"
version = "0.1.0"
edition = "2021"
description = "Shared libraries and utilities for Opus Casino platform"
license = "Proprietary"
authors = ["Opus Casino Team"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async support
tokio = { version = "1.35", features = ["full"], optional = true }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"

# Money handling
rust_decimal = { version = "1.33", features = ["serde"] }

# Logging
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
pretty_assertions = "1.4"

[features]
default = []
full = ["tokio"]
async = ["tokio"]

[lib]
name = "opus_shared"
path = "src/lib.rs"
