syntax = "proto3";

package opuscasino.auth;

option go_package = "github.com/opus-casino/proto/auth";

import "types.proto";

service AuthService {
  // Register new user
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Login with credentials
  rpc Login(LoginRequest) returns (LoginResponse);
  
  // Refresh access token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // Logout (invalidate session)
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  
  // Validate token
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // Get session info
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  
  // Enable 2FA
  rpc Enable2FA(Enable2FARequest) returns (Enable2FAResponse);
  
  // Verify 2FA code
  rpc Verify2FA(Verify2FARequest) returns (Verify2FAResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  string country = 4;
  string currency = 5;
  string device_id = 6;
  string ip_address = 7;
}

message RegisterResponse {
  opuscasino.UserId user_id = 1;
  opuscasino.AuthToken tokens = 2;
  opuscasino.Session session = 3;
  string error_code = 4;
  string error_message = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  string device_id = 3;
  string ip_address = 4;
  string totp_code = 5;
}

message LoginResponse {
  opuscasino.UserId user_id = 1;
  opuscasino.AuthToken tokens = 2;
  opuscasino.Session session = 3;
  bool requires_2fa = 4;
  string error_code = 5;
  string error_message = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string device_id = 2;
}

message RefreshTokenResponse {
  opuscasino.AuthToken tokens = 1;
  string error_code = 2;
  string error_message = 3;
}

message LogoutRequest {
  opuscasino.UserId user_id = 1;
  string session_id = 2;
}

message LogoutResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  opuscasino.UserId user_id = 2;
  string session_id = 3;
  map<string, string> claims = 4;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  opuscasino.Session session = 1;
}

message Enable2FARequest {
  opuscasino.UserId user_id = 1;
}

message Enable2FAResponse {
  string secret = 1;
  string qr_code_uri = 2;
  string error_code = 3;
  string error_message = 4;
}

message Verify2FARequest {
  opuscasino.UserId user_id = 1;
  string totp_code = 2;
}

message Verify2FAResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}
