  google.protobuf.Timestamp timestamp = 2;
  string affiliate_id = 3;
  string referred_user_id = 4;
  string flag_type = 5;
  string severity = 6;
  string details = 7;
}

// ============ ENUMS ============

enum BetResult {
  BET_RESULT_UNSPECIFIED = 0;
  BET_RESULT_WON = 1;
  BET_RESULT_LOST = 2;
  BET_RESULT_VOID = 3;
  BET_RESULT_HALF_WON = 4;
  BET_RESULT_HALF_LOST = 5;
}

enum VerificationType {
  VERIFICATION_TYPE_UNSPECIFIED = 0;
  VERIFICATION_TYPE_EMAIL = 1;
  VERIFICATION_TYPE_PHONE = 2;
  VERIFICATION_TYPE_IDENTITY = 3;
  VERIFICATION_TYPE_ADDRESS = 4;
}

enum KycStatus {
  KYC_STATUS_UNSPECIFIED = 0;
  KYC_STATUS_PENDING = 1;
  KYC_STATUS_IN_REVIEW = 2;
  KYC_STATUS_VERIFIED = 3;
  KYC_STATUS_REJECTED = 4;
  KYC_STATUS_EXPIRED = 5;
}

enum SessionTerminateReason {
  SESSION_TERMINATE_REASON_UNSPECIFIED = 0;
  SESSION_TERMINATE_REASON_LOGOUT = 1;
  SESSION_TERMINATE_REASON_EXPIRED = 2;
  SESSION_TERMINATE_REASON_KICKED = 3;
  SESSION_TERMINATE_REASON_SECURITY = 4;
}

enum FraudAlertType {
  FRAUD_ALERT_TYPE_UNSPECIFIED = 0;
  FRAUD_ALERT_TYPE_VELOCITY_CHECK = 1;
  FRAUD_ALERT_TYPE_MULTI_ACCOUNT = 2;
  FRAUD_ALERT_TYPE_BONUS_ABUSE = 3;
  FRAUD_ALERT_TYPE_ARBITRAGE_BETTING = 4;
  FRAUD_ALERT_TYPE_PAYMENT_FRAUD = 5;
  FRAUD_ALERT_TYPE_IDENTITY_FRAUD = 6;
  FRAUD_ALERT_TYPE_GEO_VIOLATION = 7;
}

enum FraudAction {
  FRAUD_ACTION_UNSPECIFIED = 0;
  FRAUD_ACTION_NONE = 1;
  FRAUD_ACTION_WARNING = 2;
  FRAUD_ACTION_ACCOUNT_REVIEW = 3;
  FRAUD_ACTION_ACCOUNT_FROZEN = 4;
  FRAUD_ACTION_ACCOUNT_CLOSED = 5;
  FRAUD_ACTION_FUNDS_WITHHELD = 6;
}
