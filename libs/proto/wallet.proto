syntax = "proto3";

package opuscasino.wallet;

option go_package = "github.com/opus-casino/proto/wallet";

import "types.proto";

service WalletCore {
  // Get wallet balance
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  
  // Get all user wallets
  rpc GetWallets(GetWalletsRequest) returns (GetWalletsResponse);
  
  // Credit wallet (deposit, win, bonus)
  rpc Credit(CreditRequest) returns (CreditResponse);
  
  // Debit wallet (withdraw, bet, fee)
  rpc Debit(DebitRequest) returns (DebitResponse);
  
  // Lock funds (for pending bets)
  rpc Lock(LockRequest) returns (LockResponse);
  
  // Unlock funds
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  
  // Transfer between wallets
  rpc Transfer(TransferRequest) returns (TransferResponse);
  
  // Get transaction history
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

message GetBalanceRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType wallet_type = 2;
}

message GetBalanceResponse {
  opuscasino.Amount balance = 1;
  opuscasino.Amount locked = 2;
}

message GetWalletsRequest {
  opuscasino.UserId user_id = 1;
}

message GetWalletsResponse {
  repeated opuscasino.Wallet wallets = 1;
}

message CreditRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType wallet_type = 2;
  opuscasino.Amount amount = 3;
  string reference_id = 4;
  string reference_type = 5;
  string idempotency_key = 6;
}

message CreditResponse {
  opuscasino.Transaction transaction = 1;
  opuscasino.Amount new_balance = 2;
  string error_code = 3;
  string error_message = 4;
}

message DebitRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType wallet_type = 2;
  opuscasino.Amount amount = 3;
  string reference_id = 4;
  string reference_type = 5;
  string idempotency_key = 6;
}

message DebitResponse {
  opuscasino.Transaction transaction = 1;
  opuscasino.Amount new_balance = 2;
  string error_code = 3;
  string error_message = 4;
}

message LockRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType wallet_type = 2;
  opuscasino.Amount amount = 3;
  string reference_id = 4;
  string idempotency_key = 5;
}

message LockResponse {
  bool success = 1;
  opuscasino.Amount new_available = 2;
  opuscasino.Amount new_locked = 3;
  string error_code = 4;
  string error_message = 5;
}

message UnlockRequest {
  opuscasino.UserId user_id = 1;
  string reference_id = 2;
}

message UnlockResponse {
  bool success = 1;
  opuscasino.Amount new_available = 2;
  opuscasino.Amount new_locked = 3;
  string error_code = 4;
  string error_message = 5;
}

message TransferRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType from_wallet = 2;
  opuscasino.WalletType to_wallet = 3;
  opuscasino.Amount amount = 4;
  string reference_id = 5;
  string idempotency_key = 6;
}

message TransferResponse {
  opuscasino.Transaction debit_transaction = 1;
  opuscasino.Transaction credit_transaction = 2;
  string error_code = 3;
  string error_message = 4;
}

message GetTransactionsRequest {
  opuscasino.UserId user_id = 1;
  opuscasino.WalletType wallet_type = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetTransactionsResponse {
  repeated opuscasino.Transaction transactions = 1;
  int32 total = 2;
}
