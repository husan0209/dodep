// Notification Service - gRPC service definition
// Handles user notifications across multiple channels

syntax = "proto3";

package notification.v1;

option go_package = "github.com/opus-casino/proto/gen/go/notification/v1";
option java_multiple_files = true;
option java_package = "com.opuscasino.proto.notification.v1";

import "common/v1/types.proto";
import "common/v1/error.proto";
import "google/protobuf/timestamp.proto";

// NotificationService handles notification operations
service NotificationService {
  // SendNotification sends a notification to user
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  // SendBulkNotification sends notifications to multiple users
  rpc SendBulkNotification(SendBulkNotificationRequest) returns (SendBulkNotificationResponse);

  // GetNotification returns notification details
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);

  // GetUserNotifications returns user's notifications
  rpc GetUserNotifications(GetUserNotificationsRequest) returns (GetUserNotificationsResponse);

  // MarkAsRead marks notification as read
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);

  // MarkAllAsRead marks all user notifications as read
  rpc MarkAllAsRead(MarkAllAsReadRequest) returns (MarkAllAsReadResponse);

  // DeleteNotification deletes a notification
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);

  // GetNotificationSettings returns user's notification settings
  rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);

  // UpdateNotificationSettings updates user's notification settings
  rpc UpdateNotificationSettings(UpdateNotificationSettingsRequest) returns (UpdateNotificationSettingsResponse);
}

// ============ Send Notification ============

message SendNotificationRequest {
  common.v1.UserId user_id = 1;
  NotificationChannel channel = 2;
  NotificationType type = 3;
  string subject = 4;
  string message = 5;
  map<string, string> data = 6;       // Template variables
  string template_id = 7;              // Optional template ID
  NotificationPriority priority = 8;
  google.protobuf.Timestamp send_at = 9;  // Schedule for later
  string reference_id = 10;            // For deduplication
}

message SendNotificationResponse {
  string notification_id = 1;
  common.v1.ErrorDetails error = 2;
}

// ============ Bulk Notification ============

message SendBulkNotificationRequest {
  repeated common.v1.UserId user_ids = 1;
  optional string user_segment = 2;    // Target user segment
  NotificationChannel channel = 3;
  NotificationType type = 4;
  string subject = 5;
  string message = 6;
  map<string, string> data = 7;
  string template_id = 8;
  NotificationPriority priority = 9;
}

message SendBulkNotificationResponse {
  int32 queued_count = 1;
  int32 failed_count = 2;
  string batch_id = 3;
}

// ============ Get Notification ============

message GetNotificationRequest {
  string notification_id = 1;
}

message GetNotificationResponse {
  Notification notification = 1;
}

// ============ User Notifications ============

message GetUserNotificationsRequest {
  common.v1.UserId user_id = 1;
  optional NotificationType type = 2;
  optional bool is_read = 3;
  optional common.v1.DateRange date_range = 4;
  common.v1.PageRequest pagination = 5;
}

message GetUserNotificationsResponse {
  repeated Notification notifications = 1;
  common.v1.PageResponse pagination = 2;
  int32 unread_count = 3;
}

// ============ Mark as Read ============

message MarkAsReadRequest {
  string notification_id = 1;
  common.v1.UserId user_id = 2;
}

message MarkAsReadResponse {
  bool success = 1;
  common.v1.ErrorDetails error = 2;
}

message MarkAllAsReadRequest {
  common.v1.UserId user_id = 1;
  optional NotificationType type = 2;
}

message MarkAllAsReadResponse {
  int32 marked_count = 1;
}

// ============ Delete Notification ============

message DeleteNotificationRequest {
  string notification_id = 1;
  common.v1.UserId user_id = 2;
}

message DeleteNotificationResponse {
  bool success = 1;
  common.v1.ErrorDetails error = 2;
}

// ============ Notification Settings ============

message GetNotificationSettingsRequest {
  common.v1.UserId user_id = 1;
}

message GetNotificationSettingsResponse {
  NotificationSettings settings = 1;
}

message UpdateNotificationSettingsRequest {
  common.v1.UserId user_id = 1;
  optional bool email_enabled = 2;
  optional bool sms_enabled = 3;
  optional bool push_enabled = 4;
  optional bool in_app_enabled = 5;
  map<NotificationType, ChannelPreferences> type_preferences = 6;
}

message UpdateNotificationSettingsResponse {
  NotificationSettings settings = 1;
  common.v1.ErrorDetails error = 2;
}

// ============ Domain Models ============

message Notification {
  string id = 1;
  common.v1.UserId user_id = 2;
  NotificationChannel channel = 3;
  NotificationType type = 4;
  NotificationPriority priority = 5;
  string subject = 6;
  string message = 7;
  map<string, string> data = 8;
  bool is_read = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp read_at = 11;
  google.protobuf.Timestamp sent_at = 12;
  NotificationStatus status = 13;
  string error_message = 14;
  string reference_id = 15;
  map<string, string> metadata = 16;
}

message NotificationSettings {
  common.v1.UserId user_id = 1;
  bool email_enabled = 2;
  bool sms_enabled = 3;
  bool push_enabled = 4;
  bool in_app_enabled = 5;
  map<NotificationType, ChannelPreferences> type_preferences = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ChannelPreferences {
  bool email_enabled = 1;
  bool sms_enabled = 2;
  bool push_enabled = 3;
  bool in_app_enabled = 4;
}

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_EMAIL = 1;
  NOTIFICATION_CHANNEL_SMS = 2;
  NOTIFICATION_CHANNEL_PUSH = 3;
  NOTIFICATION_CHANNEL_IN_APP = 4;
  NOTIFICATION_CHANNEL_TELEGRAM = 5;
  NOTIFICATION_CHANNEL_WHATSAPP = 6;
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_WELCOME = 1;
  NOTIFICATION_TYPE_DEPOSIT_CONFIRMED = 2;
  NOTIFICATION_TYPE_WITHDRAWAL_PROCESSED = 3;
  NOTIFICATION_TYPE_BET_SETTLED = 4;
  NOTIFICATION_TYPE_BONUS_ACTIVATED = 5;
  NOTIFICATION_TYPE_BONUS_EXPIRING = 6;
  NOTIFICATION_TYPE_KYC_STATUS = 7;
  NOTIFICATION_TYPE_SECURITY_ALERT = 8;
  NOTIFICATION_TYPE_PROMOTION = 9;
  NOTIFICATION_TYPE_TOURNAMENT = 10;
  NOTIFICATION_TYPE_VIP_UPDATE = 11;
  NOTIFICATION_TYPE_PAYMENT_REMINDER = 12;
  NOTIFICATION_TYPE_REALITY_CHECK = 13;
  NOTIFICATION_TYPE_SYSTEM = 14;
}

enum NotificationPriority {
  NOTIFICATION_PRIORITY_UNSPECIFIED = 0;
  NOTIFICATION_PRIORITY_LOW = 1;
  NOTIFICATION_PRIORITY_NORMAL = 2;
  NOTIFICATION_PRIORITY_HIGH = 3;
  NOTIFICATION_PRIORITY_URGENT = 4;
}

enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_PENDING = 1;
  NOTIFICATION_STATUS_SENT = 2;
  NOTIFICATION_STATUS_DELIVERED = 3;
  NOTIFICATION_STATUS_READ = 4;
  NOTIFICATION_STATUS_FAILED = 5;
}
