# Protobuf definitions for Opus Casino gRPC services

syntax = "proto3";

package opuscasino;

option go_package = "github.com/opus-casino/proto";
option java_multiple_files = true;
option java_package = "com.opuscasino.proto";

// Common types
message UserId {
  string value = 1;
}

message BetId {
  string value = 1;
}

message TransactionId {
  string value = 1;
}

message GameId {
  string value = 1;
}

message Amount {
  string value = 1;  // Decimal as string for precision
  string currency = 2;
}

message Timestamp {
  int64 unix_ms = 1;
}

// Bet types
enum BetType {
  BET_TYPE_UNSPECIFIED = 0;
  BET_TYPE_SPORTS = 1;
  BET_TYPE_CASINO = 2;
  BET_TYPE_LIVE = 3;
}

enum BetStatus {
  BET_STATUS_UNSPECIFIED = 0;
  BET_STATUS_PENDING = 1;
  BET_STATUS_ACCEPTED = 2;
  BET_STATUS_SETTLED = 3;
  BET_STATUS_CANCELLED = 4;
  BET_STATUS_REJECTED = 5;
}

message Bet {
  BetId id = 1;
  UserId user_id = 2;
  BetType type = 3;
  BetStatus status = 4;
  Amount stake = 5;
  Amount potential_win = 6;
  Amount actual_win = 7;
  string event_id = 8;
  string market_id = 9;
  string selection_id = 10;
  string odds = 11;
  Timestamp placed_at = 12;
  Timestamp settled_at = 13;
  map<string, string> metadata = 14;
}

// Wallet types
enum WalletType {
  WALLET_TYPE_UNSPECIFIED = 0;
  WALLET_TYPE_MAIN = 1;
  WALLET_TYPE_BONUS = 2;
  WALLET_TYPE_FREE_SPINS = 3;
}

message Wallet {
  UserId user_id = 1;
  WalletType type = 2;
  Amount balance = 3;
  Amount locked = 4;
  Timestamp updated_at = 5;
}

message Transaction {
  TransactionId id = 1;
  UserId user_id = 2;
  WalletType wallet_type = 3;
  Amount amount = 4;
  string type = 5;
  string reference_id = 6;
  string reference_type = 7;
  Timestamp created_at = 8;
  string status = 9;
}

// Authentication
message AuthToken {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
}

message Session {
  string session_id = 1;
  UserId user_id = 2;
  string device_id = 3;
  string ip_address = 4;
  Timestamp created_at = 5;
  Timestamp expires_at = 6;
}
