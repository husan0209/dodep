# Buf generation configuration
# Generates code for Rust (tonic/prost), Go, and TypeScript

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/opus-casino/proto/gen/go
    - file_option: java_package
      value: com.opuscasino.proto
    - file_option: java_multiple_files
      value: true

plugins:
  # Go - protocol buffers
  # `out` is relative to this file (libs/proto), so the stubs land inside the
  # github.com/opus-casino/proto module at gen/go. That is the path every
  # service resolves through its
  #   replace github.com/opus-casino/proto => ../../../libs/proto
  # and the path `make -C libs/proto gen-go` already targets. Writing them to
  # ../../gen/go instead produced a tree no Go module could reach.
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  # Go - gRPC
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  
  # Rust - prost (requires: cargo install protoc-gen-prost protoc-gen-tonic)
  # Uncomment after installing the plugins:
  # - local: protoc-gen-prost
  #   out: ../../gen/rust
  #   opt:
  #     - extern_path=.google.protobuf::prost_wkt_types
  #   strategy: all
  # - local: protoc-gen-tonic
  #   out: ../../gen/rust
  #   opt:
  #     - no_client
  #   strategy: all
  
  # TypeScript / JavaScript
  - remote: buf.build/protocolbuffers/js
    out: ../../gen/typescript
