# Buf generation configuration
# Generates code for Rust (tonic/prost), Go, and TypeScript

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/opus-casino/proto/gen/go
    - file_option: java_package
      value: com.opuscasino.proto
    - file_option: java_multiple_files
      value: true

plugins:
  # Go - protocol buffers
  # Output stays inside this directory (not ../../gen/go) so that the generated
  # packages keep the import path `github.com/opus-casino/proto/gen/go/...`
  # that the .proto files declare in `option go_package` AND that every Go
  # service imports. That path is only resolvable if gen/go lives under the
  # module root declared by libs/proto/go.mod, and the services reach this
  # module through `replace ... => ../../../libs/proto`.
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  # Go - gRPC
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  
  # Rust - prost (requires: cargo install protoc-gen-prost protoc-gen-tonic)
  # Uncomment after installing the plugins:
  # - local: protoc-gen-prost
  #   out: ../../gen/rust
  #   opt:
  #     - extern_path=.google.protobuf::prost_wkt_types
  #   strategy: all
  # - local: protoc-gen-tonic
  #   out: ../../gen/rust
  #   opt:
  #     - no_client
  #   strategy: all
  
  # TypeScript / JavaScript
  - remote: buf.build/protocolbuffers/js
    out: ../../gen/typescript
