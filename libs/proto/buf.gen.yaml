# Buf generation configuration
# Generates code for Rust (tonic/prost), Go, and TypeScript

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/opus-casino/proto/gen/go
    - file_option: java_package
      value: com.opuscasino.proto
    - file_option: java_multiple_files
      value: true

plugins:
  # Go - protocol buffers
  # `out` must stay inside this module: it defines the directory that the
  # import path github.com/opus-casino/proto/gen/go/... resolves to for every
  # service (each one carries `replace github.com/opus-casino/proto =>
  # ../../libs/proto`). Emitting to ../../gen put the packages outside the
  # module, which is why they had to be committed twice - once ignored, once
  # unused - and why CI could not compile them.
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  # Go - gRPC
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  
  # Rust - prost (requires: cargo install protoc-gen-prost protoc-gen-tonic)
  # Uncomment after installing the plugins:
  # - local: protoc-gen-prost
  #   out: gen/rust
  #   opt:
  #     - extern_path=.google.protobuf::prost_wkt_types
  #   strategy: all
  # - local: protoc-gen-tonic
  #   out: gen/rust
  #   opt:
  #     - no_client
  #   strategy: all
   
  # TypeScript / JavaScript
  # Not part of the Go module, so this one still targets the repo-level tree
  # that apps/web and apps/admin reference.
  - remote: buf.build/protocolbuffers/js
    out: ../../gen/typescript
