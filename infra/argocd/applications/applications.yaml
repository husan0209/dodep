# ArgoCD Applications
# Определяют приложения для деплоя

---
# Betting Engine - Dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-betting-engine
  namespace: argocd
  labels:
    app.kubernetes.io/name: betting-engine
    app.kubernetes.io/environment: dev
    app.kubernetes.io/team: platform
spec:
  project: services
  
  source:
    repoURL: https://github.com/opus-casino/infra.git
    targetRevision: HEAD
    path: infra/helm/charts/betting-engine
    helm:
      valueFiles:
        - values-dev.yaml
      values: |
        image:
          repository: ghcr.io/opus-casino/betting-engine
          tag: latest
          
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
        
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        
  healthChecks:
    - group: apps
      kind: Deployment
      script: |
        hs = {}
        if obj.status.readyReplicas == obj.spec.replicas then
          hs.status = "Healthy"
          hs.message = "Deployment is healthy"
        else
          hs.status = "Progressing"
          hs.message = "Waiting for deployment to be ready"
        end
        return hs

