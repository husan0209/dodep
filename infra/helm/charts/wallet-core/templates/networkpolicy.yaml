{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wallet-core.fullname" . }}
  labels:
    {{- include "wallet-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wallet-core.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingressFrom:
    {{- toYaml .Values.networkPolicy.allowIngressFrom | nindent 4 }}
  ingress:
    - ports:
        - port: grpc
          protocol: TCP
        - port: http
          protocol: TCP
        - port: metrics
          protocol: TCP
{{- end }}
