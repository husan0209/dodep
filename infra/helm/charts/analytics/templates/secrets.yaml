apiVersion: v1
kind: Secret
metadata:
  name: {{ include "analytics.fullname" . }}-secrets
  labels:
    {{- include "analytics.labels" . | nindent 4 }}
type: Opaque
stringData:
  clickhouse-username: {{ .Values.analytics.clickhouse.user | default "analytics" | quote }}
  # Override via --set analytics.clickhouse.password=... or external-secrets.
  # Never commit real credentials.
  clickhouse-password: {{ .Values.analytics.clickhouse.password | default "" | quote }}
