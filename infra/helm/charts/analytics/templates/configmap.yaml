apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "analytics.fullname" . }}-config
  labels:
    {{- include "analytics.labels" . | nindent 4 }}
data:
  app-env: {{ .Values.app_env | default "development" | quote }}

  # ClickHouse configuration (HTTP interface for clickhouse-connect)
  clickhouse-host: {{ .Values.analytics.clickhouse.host | quote }}
  clickhouse-port: {{ .Values.analytics.clickhouse.port | quote }}

  # Redis (DragonflyDB-compatible)
  redis-host: {{ .Values.analytics.redis.host | quote }}
