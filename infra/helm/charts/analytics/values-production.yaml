# Analytics Service — production overrides.
replicaCount: 3

image:
  tag: "0.1.0"

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

analytics:
  clickhouse:
    host: "clickhouse-data"
    port: 8123
    database: "opus_casino"
    user: "analytics"
  redis:
    host: "dragonflydb-data"
    port: 6379
