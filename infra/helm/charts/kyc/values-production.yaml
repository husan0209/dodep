# KYC Service - Production Environment Values

replicaCount: 6

image:
  tag: "v1.0.0"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/opus-casino-production-kyc-role"

resources:
  limits:
    cpu: 4000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 30
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 4

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - namespaceSelector:
            matchLabels:
              name: production
      ports:
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 50059
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 4317
    - to: []
      ports:
        - protocol: TCP
          port: 443

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  port: metrics

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/protocol: HTTPS
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
  hosts:
    - host: api.opus.casino
      paths:
        - path: /api/v1/kyc
          pathType: Prefix
  tls:
    - secretName: opus-casino-production-tls
      hosts:
        - api.opus.casino

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - application
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kyc
          topologyKey: kubernetes.io/hostname

tolerations:
  - key: "application"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

env:
  - name: APP_ENV
    value: "production"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: database-url
  - name: REDIS_ADDR
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: redis-addr
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: redis-password
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: jwt-secret-key
  - name: KYC_FIELD_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: kyc-field-key
  - name: SUMSUB_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: sumsub-webhook-secret
  - name: COMPLYADVANTAGE_API_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets-production
        key: complyadvantage-api-key

kyc:
  providers:
    sumsub:
      enabled: true
      base_url: "https://api.sumsub.com"
    complyadvantage:
      enabled: true
      base_url: "https://api.complyadvantage.com"
  cache:
    status_ttl: 60s
  documents:
    address_freshness_days: 90
