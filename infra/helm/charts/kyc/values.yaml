# KYC Service Helm Chart Values
# Сервис верификации личности, PEP/sanctions скрининга и compliance
# Ports per CONVENTIONS.md — kyc: 8089 HTTP / 50059 gRPC.

replicaCount: 3

image:
  repository: ghcr.io/opus-casino/kyc
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""

podAnnotations:
  prometheus.io/scrape: "true"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8089
  httpTargetPort: 8089
  grpcPort: 50059
  grpcTargetPort: 50059

ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: api.opus.casino
      paths:
        - path: /api/v1/kyc
          pathType: Prefix
  tls:
    - secretName: opus-casino-tls
      hosts:
        - api.opus.casino

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

nodeSelector:
  node-type: application

healthCheck:
  path: /health
  port: 8089
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Secrets are referenced, NEVER inlined (CONVENTIONS NEVER-5).
# kyc-secrets must provide: database-url, redis-addr, redis-password,
# jwt-secret-key, kyc-field-key, sumsub-webhook-secret,
# sumsub-api-key, sumsub-api-secret, complyadvantage-api-key.
env:
  - name: APP_ENV
    valueFrom:
      configMapKeyRef:
        name: kyc-config
        key: app-env
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: database-url
  - name: REDIS_ADDR
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: redis-addr
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: redis-password
  - name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: jwt-secret-key
  - name: KYC_FIELD_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: kyc-field-key
  - name: SUMSUB_WEBHOOK_SECRET
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: sumsub-webhook-secret
  - name: COMPLYADVANTAGE_API_KEY
    valueFrom:
      secretKeyRef:
        name: kyc-secrets
        key: complyadvantage-api-key

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 50059
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    - to: []
      ports:
        - protocol: TCP
          port: 443

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: metrics

# KYC-specific settings
kyc:
  providers:
    sumsub:
      enabled: true
      base_url: "https://api.sumsub.com"
    complyadvantage:
      enabled: false # stub provider until PSP credentials land
      base_url: "https://api.complyadvantage.com"
  cache:
    status_ttl: 60s # NEVER cache KYC level longer than 1 minute
  documents:
    address_freshness_days: 90
