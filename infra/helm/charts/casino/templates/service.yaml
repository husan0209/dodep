apiVersion: v1
kind: Service
metadata:
  name: {{ include "casino.fullname" . }}
  labels:
    {{- include "casino.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.httpTargetPort }}"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "casino.selectorLabels" . | nindent 4 }}
