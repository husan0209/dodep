# Default values for service-chart
# Это базовые значения, переопределяются в конкретных chart'ах

replicaCount: 1

image:
  repository: ghcr.io/opus-casino/service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Optional second (gRPC) port. When set, Deployment exposes a `grpc`
  # containerPort and Service exposes a `grpc` port alongside `http`.
  # When unset, rendering is identical to the single-port behaviour.
  # grpcPort: 50051
  # grpcTargetPort: 50051
  #
  # Additional named ports (e.g. Prometheus `metrics`). Each entry needs
  # name/containerPort (pod) and name/port/targetPort (Service):
  # extraPorts:
  #   - name: metrics
  #     containerPort: 8080
  #     port: 8080
  #     targetPort: 8080
  extraPorts: []
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "alb"
  annotations: {}
  hosts:
    - host: api.opus.casino
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Health checks
healthCheck:
  path: /health
  port: 8080
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Environment variables
env: []
  # - name: LOG_LEVEL
  #   value: "info"
  # - name: DATABASE_URL
  #   valueFrom:
  #     secretKeyRef:
  #       name: db-secret
  #       key: url

# ConfigMap references
configMaps: []

# Secret references
secrets: []

# Volume mounts
volumeMounts: []

# Volumes
volumes: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Network policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Service monitor (Prometheus)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: metrics
