apiVersion: v1
kind: Secret
metadata:
  name: {{ include "affiliate.fullname" . }}-secrets
  labels:
    {{- include "affiliate.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Real values come from Vault / external-secrets in cluster.
  # Placeholders only satisfy envFrom + local `helm template` rendering.
  database-url: "postgres://localhost:5432/affiliate"
  redis-addr: "dragonflydb-data:6379"
  redis-password: ""
  jwt-secret-key: ""
