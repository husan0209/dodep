# Pyroscope Continuous Profiling
# CPU and memory profiling for applications

---
# Pyroscope Server
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyroscope
  namespace: monitoring
  labels:
    app: pyroscope
spec:
  serviceName: pyroscope
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4040"
    spec:
      serviceAccountName: pyroscope
      securityContext:
        fsGroup: 1000
      containers:
        - name: pyroscope
          image: pyroscope/pyroscope:v1.7.0
          ports:
            - name: http
              containerPort: 4040
          args:
            - server
            - --log-level=info
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/pyroscope
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pyroscope-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi

---
# Pyroscope Service
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: monitoring
  labels:
    app: pyroscope
spec:
  ports:
    - name: http
      port: 4040
      targetPort: http
  selector:
    app: pyroscope
  type: ClusterIP

---
# Pyroscope Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyroscope
  namespace: monitoring
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: pyroscope.opus.casino
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyroscope
                port:
                  number: 4040
  tls:
    - hosts:
        - pyroscope.opus.casino
      secretName: pyroscope-tls

---
# Pyroscope ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pyroscope
  namespace: monitoring

---
# Pyroscope ConfigMap for SDK configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-config
  namespace: monitoring
data:
  rust-example.rs: |
    // Rust Pyroscope integration example
    use pyroscope::PyroscopeAgent;
    use pyroscope::backend::{Backend, BackendGuard};
    
    pub fn init_profiling() -> Result<(), Box<dyn std::error::Error>> {
        let agent = PyroscopeAgent::builder(
            "https://pyroscope.opus.casino",
            "betting-engine",
        )
        .backend(Backend::default())
        .build()?;
        
        let agent_running = agent.start()?;
        
        // Your application code here
        
        let agent_ready = agent_running.stop()?;
        agent_ready.shutdown();
        
        Ok(())
    }
    
  go-example.go: |
    // Go Pyroscope integration example
    import (
        "runtime/pprof"
        "github.com/grafana/pyroscope-go"
    )
    
    func initProfiling() {
        pyroscope.Start(pyroscope.Config{
            ApplicationName: "auth-service",
            ServerAddress:   "https://pyroscope.opus.casino",
            AuthToken:       "your-token",
            ProfileTypes: []pyroscope.ProfileType{
                pyroscope.ProfileCPU,
                pyroscope.ProfileAllocObjects,
                pyroscope.ProfileAllocSpace,
                pyroscope.ProfileInuseObjects,
                pyroscope.ProfileInuseSpace,
            },
            UploadRate: 10 * time.Second,
        })
    }
    
  python-example.py: |
    # Python Pyroscope integration example
    import pyroscope
    from pyroscope.flamegraph import Flamegraph
    
    def init_profiling():
        pyroscope.configure(
            application_name = "fraud-ml",
            server_address = "https://pyroscope.opus.casino",
            auth_token = "your-token",
        )
        
    # Or use context manager
    with pyroscope.profile(
        service_name="analytics",
        server_address="https://pyroscope.opus.casino"
    ):
        # Your application code here
        pass
