# VictoriaMetrics Cluster Installation
# High-performance time-series database

---
# vmselect Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
  namespace: monitoring
  labels:
    app: vmselect
    app.kubernetes.io/name: vmselect
    app.kubernetes.io/component: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vmselect
  template:
    metadata:
      labels:
        app: vmselect
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8481"
    spec:
      serviceAccountName: victoriametrics
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vmselect
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vmselect
          image: victoriametrics/vmselect:v1.95.0
          args:
            - --storageNode=vmstorage-0.vmstorage.monitoring.svc.cluster.local:8401
            - --storageNode=vmstorage-1.vmstorage.monitoring.svc.cluster.local:8401
            - --storageNode=vmstorage-2.vmstorage.monitoring.svc.cluster.local:8401
            - --httpListenAddr=:8481
            - --grpcListenAddr=:8401
            - --vmalertProxyURL=http://vmalert:8880
          ports:
            - name: http
              containerPort: 8481
            - name: grpc
              containerPort: 8401
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp-cache
              mountPath: /tmp
      volumes:
        - name: tmp-cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
# vmselect Service
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  namespace: monitoring
  labels:
    app: vmselect
spec:
  ports:
    - name: http
      port: 8481
      targetPort: http
    - name: grpc
      port: 8401
      targetPort: grpc
  selector:
    app: vmselect
  type: ClusterIP

---
# vminsert Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
  namespace: monitoring
  labels:
    app: vminsert
    app.kubernetes.io/name: vminsert
    app.kubernetes.io/component: database
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vminsert
  template:
    metadata:
      labels:
        app: vminsert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8480"
    spec:
      serviceAccountName: victoriametrics
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vminsert
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vminsert
          image: victoriametrics/vminsert:v1.95.0
          args:
            - --storageNode=vmstorage-0.vmstorage.monitoring.svc.cluster.local:8400
            - --storageNode=vmstorage-1.vmstorage.monitoring.svc.cluster.local:8400
            - --storageNode=vmstorage-2.vmstorage.monitoring.svc.cluster.local:8400
            - --httpListenAddr=:8480
            - --grpcListenAddr=:8400
            - --replicationFactor=2
          ports:
            - name: http
              containerPort: 8480
            - name: grpc
              containerPort: 8400
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp-cache
              mountPath: /tmp
      volumes:
        - name: tmp-cache
          emptyDir: {}
      terminationGracePeriodSeconds: 30

---
# vminsert Service
apiVersion: v1
kind: Service
metadata:
  name: vminsert
  namespace: monitoring
  labels:
    app: vminsert
spec:
  ports:
    - name: http
      port: 8480
      targetPort: http
    - name: grpc
      port: 8400
      targetPort: grpc
  selector:
    app: vminsert
  type: ClusterIP

---
# vmstorage StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: monitoring
  labels:
    app: vmstorage
    app.kubernetes.io/name: vmstorage
    app.kubernetes.io/component: database
spec:
  serviceName: vmstorage
  replicas: 3
  selector:
    matchLabels:
      app: vmstorage
  template:
    metadata:
      labels:
        app: vmstorage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8482"
    spec:
      serviceAccountName: victoriametrics
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vmstorage
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vmstorage
          image: victoriametrics/vmstorage:v1.95.0
          args:
            - --storageDataPath=/storage
            - --httpListenAddr=:8482
            - --grpcListenAddr=:8400
            - --vminsertAddr=:8400
            - --vmselectAddr=:8401
            - --retentionPeriod=3
          ports:
            - name: http
              containerPort: 8482
            - name: grpc
              containerPort: 8400
            - name: vminsert
              containerPort: 8400
            - name: vmselect
              containerPort: 8401
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /storage
      volumes:
        - name: tmp-cache
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast
        resources:
          requests:
            storage: 500Gi

---
# vmstorage Service (headless)
apiVersion: v1
kind: Service
metadata:
  name: vmstorage
  namespace: monitoring
  labels:
    app: vmstorage
spec:
  ports:
    - name: http
      port: 8482
      targetPort: http
    - name: grpc
      port: 8400
      targetPort: grpc
  clusterIP: None
  selector:
    app: vmstorage

---
# ServiceAccount for VictoriaMetrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: monitoring

---
# PodDisruptionBudget for vmselect
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vmselect-pdb
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vmselect

---
# PodDisruptionBudget for vminsert
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vminsert-pdb
  namespace: monitoring
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vminsert

---
# PodDisruptionBudget for vmstorage
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vmstorage-pdb
  namespace: monitoring
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: vmstorage
