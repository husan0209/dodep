# ============================================================
# Istio routing — Affiliate Service (standalone file)
# Does NOT edit infra/k8s/istio/production/production-config.yaml.
# Merges with api-routing VirtualService by shared host.
# Service ports per CONVENTIONS.md: 8090 (HTTP). gRPC 50061 is
# cluster-internal (no gateway route).
# ============================================================
# --- Affiliate API + click-tracking routing ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: affiliate-api-routing
  namespace: platform
spec:
  hosts:
    - "api.opus-casino.com"
  gateways:
    - istio-system/platform-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/affiliate
      route:
        - destination:
            host: affiliate-service
            port:
              number: 8090
      timeout: 10s
    - match:
        - uri:
            prefix: /r/
      route:
        - destination:
            host: affiliate-service
            port:
              number: 8090
      timeout: 10s
    - match:
        - uri:
            exact: /r
      route:
        - destination:
            host: affiliate-service
            port:
              number: 8090
      timeout: 10s
---
# --- DestinationRule (mTLS + outlier detection, mirrors existing services) ---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: affiliate-service
  namespace: platform
spec:
  host: affiliate-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 5s
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
    loadBalancer:
      simple: ROUND_ROBIN
---
# --- AuthorizationPolicy (gateway + monitoring only; service is user-facing) ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: affiliate-service-policy
  namespace: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: affiliate
      app.kubernetes.io/component: affiliate-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      to:
        - operation:
            ports: ["8090"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["8090"]
