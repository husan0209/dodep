# ============================================================
# Istio Production Configuration
# ============================================================

# --- PeerAuthentication: STRICT mTLS ---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: platform-mtls
  namespace: platform
spec:
  mtls:
    mode: STRICT
---
# --- Gateway ---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: platform-tls-cert
      hosts:
        - "api.opus-casino.com"
        - "admin.opus-casino.com"
        - "ws.opus-casino.com"
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.opus-casino.com"
      tls:
        httpsRedirect: true
---
# --- API Routing (VirtualService) ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-routing
  namespace: platform
spec:
  hosts:
    - "api.opus-casino.com"
  gateways:
    - istio-system/platform-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/auth
      route:
        - destination:
            host: auth-service
            port:
              number: 8080
      timeout: 10s
    - match:
        - uri:
            prefix: /api/v1/users
      route:
        - destination:
            host: user-service
            port:
              number: 8080
      timeout: 10s
    - match:
        - uri:
            prefix: /api/v1/bets
      route:
        - destination:
            host: betting-engine
            port:
              number: 8080
      timeout: 10s
      retries:
        attempts: 0 # POST bets — не ретраить (не идемпотентно без ключа)
    - match:
        - uri:
            prefix: /api/v1/wallet
      route:
        - destination:
            host: wallet-service
            port:
              number: 8080
      timeout: 5s
    - match:
        - uri:
            prefix: /api/v1/payments
      route:
        - destination:
            host: payment-service
            port:
              number: 8080
      timeout: 30s
    - match:
        - uri:
            prefix: /api/v1/casino
      route:
        - destination:
            host: casino-service
            port:
              number: 8080
      timeout: 15s
    - match:
        - uri:
            prefix: /api/v1/bonuses
      route:
        - destination:
            host: bonus-service
            port:
              number: 8080
      timeout: 10s
    - match:
        - uri:
            prefix: /api/v1/kyc
      route:
        - destination:
            host: kyc-service
            port:
              number: 8080
      timeout: 30s
    - match:
        - uri:
            prefix: /api/v1/notifications
      route:
        - destination:
            host: notification-service
            port:
              number: 8080
      timeout: 10s
    - match:
        - uri:
            prefix: /api/v1/detect
      route:
        - destination:
            host: fraud-ml
            port:
              number: 8000
      timeout: 5s
---
# --- Admin Panel Routing ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: admin-routing
  namespace: platform
spec:
  hosts:
    - "admin.opus-casino.com"
  gateways:
    - istio-system/platform-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1/admin
      route:
        - destination:
            host: api-gateway
            port:
              number: 8080
      timeout: 15s
    - route:
        - destination:
            host: admin-panel
            port:
              number: 80
      timeout: 10s
---
# --- WebSocket Routing ---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ws-routing
  namespace: platform
spec:
  hosts:
    - "ws.opus-casino.com"
  gateways:
    - istio-system/platform-gateway
  http:
    - route:
        - destination:
            host: websocket-gateway
            port:
              number: 8080
      timeout: 3600s # 1 час для WebSocket
      websocketUpgrade: true
---
# --- DestinationRules ---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: betting-engine
  namespace: platform
spec:
  host: betting-engine
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 2000
        connectTimeout: 5s
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
    loadBalancer:
      simple: LEAST_REQUEST
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: wallet-service
  namespace: platform
spec:
  host: wallet-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 3s
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 20
    loadBalancer:
      simple: LEAST_REQUEST
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: platform
spec:
  host: auth-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 5s
      http:
        maxRequestsPerConnection: 50
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
    loadBalancer:
      simple: ROUND_ROBIN
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: websocket-gateway
  namespace: platform
spec:
  host: websocket-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10000
        connectTimeout: 5s
      http:
        maxRequestsPerConnection: 1 # WebSocket = 1 connection per request
    loadBalancer:
      simple: ROUND_ROBIN
---
# --- Authorization Policies ---
# Deny all by default
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: platform
spec: {} # empty = deny all
---
# Allow from ingress gateway to all services
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-from-gateway
  namespace: platform
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              ["cluster.local/ns/istio-system/sa/istio-ingressgateway"]
      to:
        - operation:
            ports: ["8080", "8000", "80"]
---
# Betting Engine: allow from gateway + wallet + risk
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: betting-engine-policy
  namespace: platform
spec:
  selector:
    matchLabels:
      app: betting-engine
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
              - "cluster.local/ns/platform/sa/wallet-service"
              - "cluster.local/ns/platform/sa/risk-engine"
      to:
        - operation:
            ports: ["8080", "9000"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9090"]
---
# Wallet Service: allow from betting + payment + casino + bonus
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: wallet-service-policy
  namespace: platform
spec:
  selector:
    matchLabels:
      app: wallet-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
              - "cluster.local/ns/platform/sa/betting-engine"
              - "cluster.local/ns/platform/sa/payment-service"
              - "cluster.local/ns/platform/sa/casino-service"
              - "cluster.local/ns/platform/sa/bonus-service"
      to:
        - operation:
            ports: ["8080", "9000"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9090"]
---
# Auth Service: allow from gateway only
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: auth-service-policy
  namespace: platform
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      to:
        - operation:
            ports: ["8080", "9000"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9090"]
---
# PostgreSQL: allow only from platform namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: postgres-policy
  namespace: data
spec:
  selector:
    matchLabels:
      app: postgresql
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["platform"]
      to:
        - operation:
            ports: ["5432"]
---
# DragonflyDB: allow only from platform namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: dragonfly-policy
  namespace: data
spec:
  selector:
    matchLabels:
      app: dragonflydb
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["platform"]
      to:
        - operation:
            ports: ["6379"]
---
# Redpanda: allow only from platform namespace
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redpanda-policy
  namespace: data
spec:
  selector:
    matchLabels:
      app: redpanda
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["platform"]
      to:
        - operation:
            ports: ["9092", "9093", "9644"]
---
# Telemetry
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mesh-telemetry
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: jaeger
      randomSamplingPercentage: 10
      customTags:
        environment:
          literal:
            value: production
  metrics:
    - providers:
        - name: prometheus
