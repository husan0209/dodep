# ============================================================
# Istio mesh policy — Analytics Service (standalone file)
# Does NOT edit infra/k8s/istio/production/production-config.yaml.
# NO VirtualService: the service is internal-only (ClusterIP, no public
# ingress in its Helm chart). Only mesh-internal mTLS routing policy
# and an authorization policy scoped to platform + monitoring.
# Destination host must match the deployed Service name
# (<release>-analytics, or "analytics" when released as "analytics").
# ============================================================
# --- DestinationRule (mTLS + outlier detection, mirrors existing services) ---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: analytics-service
  namespace: platform
spec:
  host: analytics
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 5s
      http:
        h2UpgradePolicy: UPGRADE
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 30
    loadBalancer:
      simple: ROUND_ROBIN
---
# --- AuthorizationPolicy (platform callers + monitoring only) ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: analytics-service-policy
  namespace: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics
      app.kubernetes.io/component: analytics-service
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["platform"]
      to:
        - operation:
            ports: ["8000"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["8000"]
