# Jaeger tracing deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: opus-casino
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      serviceAccountName: opus-casino
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.54
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: SPAN_STORAGE_TYPE
          value: "memory"
        - name: QUERY_BASE_PATH
          value: /jaeger
        - name: COLLECTOR_OTLP_GRPC_HOST_PORT
          value: "0.0.0.0:4317"
        - name: COLLECTOR_OTLP_HTTP_HOST_PORT
          value: "0.0.0.0:4318"
        ports:
        - name: http
          containerPort: 16686
        - name: grpc
          containerPort: 4317
        - name: http-otlp
          containerPort: 4318
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: opus-casino
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: http
    port: 16686
    targetPort: 16686
  - name: grpc
    port: 4317
    targetPort: 4317
  - name: http-otlp
    port: 4318
    targetPort: 4318
  type: ClusterIP
