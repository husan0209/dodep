# Network Policies для безопасности
# Контролирует трафик между pod'ами

---
# Default Deny All Ingress Traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Default Deny All Egress Traffic (опционально)
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
