# Vault Agent Injector Configuration
# Автоматическая инъекция секретов в поды

---
# Vault Agent Injector ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-injector-config
  namespace: security
data:
  config.json: |
    {
      "auto_auth": {
        "method": {
          "type": "kubernetes",
          "config": {
            "role": "vault-agent",
            "token_path": "/var/run/secrets/kubernetes.io/serviceaccount/token"
          }
        },
        "sink": {
          "type": "file",
          "config": {
            "path": "/vault/secrets/token"
          }
        }
      },
      "templates": [
        {
          "destination": "/vault/secrets/database-url.txt",
          "contents": "{{ with secret \"database/creds/betting-engine\" }}postgres://{{ .Data.username }}:{{ .Data.password }}@postgresql:5432/opus_casino{{ end }}"
        }
      ]
    }

---
# Example: Betting Engine with Vault Agent Injector
apiVersion: v1
kind: Pod
metadata:
  name: betting-engine-example
  namespace: production
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-secret-database-url.txt: "secret/data/betting-engine/database"
    vault.hashicorp.com/agent-inject-template-database-url.txt: |
      {{- with secret "secret/data/betting-engine/database" -}}
      postgres://{{ .Data.data.username }}:{{ .Data.data.password }}@postgresql:5432/opus_casino
      {{- end }}
    vault.hashicorp.com/agent-inject-secret-redis-url.txt: "secret/data/betting-engine/redis"
    vault.hashicorp.com/agent-pre-populate-only: "true"
    vault.hashicorp.com/role: "betting-engine"
spec:
  serviceAccountName: betting-engine
  containers:
    - name: betting-engine
      image: ghcr.io/opus-casino/betting-engine:latest
      env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vault-secret-database-url
              key: database-url
      volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
  volumes:
    - name: vault-secrets
      projected:
        sources:
          - secret:
              name: vault-secret-database-url

---
# Vault Agent Injector ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-agent
  namespace: security
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "vault-agent"

---
# Vault Agent Injector Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

---
# Vault Agent Injector ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent
subjects:
  - kind: ServiceAccount
    name: vault-agent
    namespace: security

---
# Vault Agent Injector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-agent-injector
  namespace: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vault-agent-injector
  template:
    metadata:
      labels:
        app: vault-agent-injector
    spec:
      serviceAccountName: vault-agent
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15
          command: ["vault"]
          args: ["agent", "-config=/etc/vault/config.json"]
          env:
            - name: VAULT_ADDR
              value: "https://vault.security.svc.cluster.local:8200"
            - name: VAULT_CACERT
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          volumeMounts:
            - name: config
              mountPath: /etc/vault
            - name: secrets
              mountPath: /vault/secrets
      volumes:
        - name: config
          configMap:
            name: vault-agent-injector-config
        - name: secrets
          emptyDir:
            medium: Memory
