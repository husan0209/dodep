user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/xml+rss image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=5r/h;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=60r/m;

    # Upstream: Go services
    upstream auth_upstream         { server auth:8083;         keepalive 32; }
    upstream user_upstream         { server user:8085;         keepalive 32; }
    upstream payment_upstream      { server payment:8084;      keepalive 32; }
    upstream casino_upstream       { server casino:8086;       keepalive 32; }
    upstream bonus_upstream        { server bonus:8088;        keepalive 16; }
    upstream notification_upstream { server notification:8087; keepalive 16; }
    upstream kyc_upstream          { server kyc:8089;          keepalive 16; }
    upstream admin_bff_upstream    { server admin-bff:8091;    keepalive 32; }

    # Upstream: Rust services
    upstream betting_upstream      { server betting-engine:8080;    keepalive 64; }
    upstream wallet_upstream       { server wallet-core:8081;       keepalive 64; }
    upstream ws_upstream           { server websocket-gateway:8082; keepalive 128; }

    # Upstream: Frontend
    upstream web_upstream          { server web:3000;    keepalive 32; }
    upstream admin_ui_upstream     { server admin:80;    keepalive 16; }

    # ─── Main server block (HTTP → HTTPS redirect) ──────────────────
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS Main Site ────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${APP_DOMAIN:-localhost};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:; frame-src 'self' https://pragmaticplay.net https://pgsoft-games.com;" always;

        client_max_body_size 10m;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # ── Auth ──────────────────────────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://auth_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/auth/register {
            limit_req zone=register burst=5 nodelay;
            proxy_pass http://auth_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Users ────────────────────────────────────────────────
        location /api/v1/users/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://user_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Payments ─────────────────────────────────────────────
        location /api/v1/payments/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://payment_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── NOWPayments IPN Webhook (no rate limit — whitelisted IPs only) ─
        location /api/v1/payments/webhooks/nowpayments {
            # Allow only NOWPayments IPs
            allow 51.77.0.0/16;
            allow 54.195.0.0/16;
            allow 3.249.0.0/16;
            deny all;
            proxy_pass http://payment_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Casino Wallet API (called by game providers) ──────────
        location /api/v1/casino/wallet/ {
            # Rate-limit: providers are trusted, but protect against replay
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Pragmatic Play Callbacks ──────────────────────────────
        location /api/v1/casino/providers/pragmatic/ {
            # Restrict to Pragmatic IP ranges
            include /etc/nginx/conf.d/ip_allowlist_pragmatic.conf;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── PG Soft Callbacks ─────────────────────────────────────
        location /api/v1/casino/providers/pgsoft/ {
            include /etc/nginx/conf.d/ip_allowlist_pgsoft.conf;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Amatic Callbacks ──────────────────────────────────────
        location /api/v1/casino/providers/amatic/ {
            include /etc/nginx/conf.d/ip_allowlist_amatic.conf;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Amusnet Callbacks ─────────────────────────────────────
        location /api/v1/casino/providers/amusnet/ {
            include /etc/nginx/conf.d/ip_allowlist_amusnet.conf;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Casino REST API ───────────────────────────────────────
        location /api/v1/casino/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://casino_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Bets ─────────────────────────────────────────────────
        location /api/v1/bets/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://betting_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Wallet ───────────────────────────────────────────────
        location /api/v1/wallet/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://wallet_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Bonus ────────────────────────────────────────────────
        location /api/v1/bonuses/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://bonus_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── KYC ──────────────────────────────────────────────────
        location /api/v1/kyc/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://kyc_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── WebSocket (real-time odds + notifications) ────────────
        location /ws {
            proxy_pass http://ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Admin API (admin-bff) ─────────────────────────────────
        location /admin-api/ {
            # Restrict admin API to VPN / management IP
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://admin_bff_upstream/;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Next.js web app (catch-all) ───────────────────────────
        location / {
            proxy_pass http://web_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # ─── Admin Panel (separate subdomain / path) ─────────────────────
    server {
        listen 443 ssl http2;
        server_name admin.${APP_DOMAIN:-localhost};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security: restrict to internal / VPN
        # allow 10.0.0.0/8;
        # deny all;

        location / {
            proxy_pass http://admin_ui_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /admin-api/ {
            proxy_pass http://admin_bff_upstream/;
            include /etc/nginx/conf.d/proxy_params.conf;
        }
    }
}
