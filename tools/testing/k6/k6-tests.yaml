# k6 Load Testing Scripts
# Performance testing for Opus Casino platform

---
# k6 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  namespace: monitoring
data:
  betting-engine-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate } from 'k6/metrics';
    
    // Custom metrics
    const errorRate = new Rate('errors');
    
    // Test configuration
    export const options = {
      stages: [
        { duration: '2m', target: 100 },   // Ramp up to 100 users
        { duration: '5m', target: 100 },   // Stay at 100 users
        { duration: '2m', target: 200 },   // Ramp up to 200 users
        { duration: '5m', target: 200 },   // Stay at 200 users
        { duration: '2m', target: 500 },   // Ramp up to 500 users (stress)
        { duration: '5m', target: 500 },   // Stay at 500 users
        { duration: '2m', target: 0 },     // Ramp down
      ],
      thresholds: {
        http_req_duration: ['p(95)<500'],  // 95% of requests should be below 500ms
        http_req_failed: ['rate<0.01'],    // Error rate should be below 1%
        errors: ['rate<0.01'],             // Custom error rate threshold
      },
    };
    
    const BASE_URL = __ENV.BASE_URL || 'http://betting-engine.dev.svc.cluster.local:8080';
    
    export default function () {
      // Test health endpoint
      const healthRes = http.get(`${BASE_URL}/health`);
      check(healthRes, {
        'health status is 200': (r) => r.status === 200,
      });
      errorRate.add(healthRes.status !== 200);
      
      sleep(1);
      
      // Test place bet endpoint
      const betPayload = JSON.stringify({
        user_id: Math.floor(Math.random() * 10000),
        event_id: 12345,
        selection_id: 67890,
        stake: 10.00,
        odds: 2.50,
        bet_type: 'single',
      });
      
      const betRes = http.post(`${BASE_URL}/api/v1/bets/place`, betPayload, {
        headers: { 'Content-Type': 'application/json' },
      });
      
      check(betRes, {
        'bet status is 200 or 201': (r) => r.status === 200 || r.status === 201,
        'bet has id': (r) => JSON.parse(r.body).bet_id !== undefined,
      });
      errorRate.add(betRes.status !== 200 && betRes.status !== 201);
      
      sleep(1);
      
      // Test get odds endpoint
      const oddsRes = http.get(`${BASE_URL}/api/v1/odds/12345`);
      check(oddsRes, {
        'odds status is 200': (r) => r.status === 200,
      });
      errorRate.add(oddsRes.status !== 200);
      
      sleep(1);
    }
    
    export function handleSummary(data) {
      return {
        'summary.json': JSON.stringify(data),
      };
    }
    
  auth-service-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate } from 'k6/metrics';
    
    const errorRate = new Rate('errors');
    
    export const options = {
      stages: [
        { duration: '2m', target: 50 },
        { duration: '5m', target: 50 },
        { duration: '2m', target: 100 },
        { duration: '5m', target: 100 },
        { duration: '2m', target: 0 },
      ],
      thresholds: {
        http_req_duration: ['p(95)<200'],
        http_req_failed: ['rate<0.01'],
      },
    };
    
    const BASE_URL = __ENV.BASE_URL || 'http://auth.dev.svc.cluster.local:8080';
    
    export default function () {
      // Test login endpoint
      const loginPayload = JSON.stringify({
        email: `user${Math.floor(Math.random() * 10000)}@test.com`,
        password: 'testpassword123',
      });
      
      const loginRes = http.post(`${BASE_URL}/api/v1/auth/login`, loginPayload, {
        headers: { 'Content-Type': 'application/json' },
      });
      
      check(loginRes, {
        'login status is 200 or 401': (r) => r.status === 200 || r.status === 401,
      });
      errorRate.add(loginRes.status !== 200 && loginRes.status !== 401);
      
      sleep(1);
      
      // Test health endpoint
      const healthRes = http.get(`${BASE_URL}/health`);
      check(healthRes, {
        'health status is 200': (r) => r.status === 200,
      });
      
      sleep(1);
    }
    
  websocket-test.js: |
    import ws from 'k6/ws';
    import { check } from 'k6';
    
    export const options = {
      stages: [
        { duration: '2m', target: 100 },
        { duration: '5m', target: 100 },
        { duration: '2m', target: 0 },
      ],
      thresholds: {
        'ws_connecting': ['count>0'],
      },
    };
    
    const WS_URL = __ENV.WS_URL || 'ws://websocket-gateway.dev.svc.cluster.local:8080/ws';
    
    export default function () {
      const response = ws.connect(WS_URL, {}, function (socket) {
        socket.on('open', () => {
          console.log('WebSocket connected');
        });
        
        socket.on('message', (data) => {
          console.log('Message received:', data);
        });
        
        socket.on('close', () => {
          console.log('WebSocket disconnected');
        });
        
        socket.on('error', (error) => {
          console.log('WebSocket error:', error);
        });
        
        socket.setTimeout(() => {
          socket.close();
        }, 60000);
      });
      
      check(response, {
        'status is 101': (r) => r && r.status === 101,
      });
    }

---
# k6 Test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-betting-engine-test
  namespace: monitoring
  labels:
    app: k6
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: k6
    spec:
      serviceAccountName: k6
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          command: ["k6", "run", "/scripts/betting-engine-test.js"]
          env:
            - name: BASE_URL
              value: "http://betting-engine.dev.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
            defaultMode: 0755

---
# k6 ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6
  namespace: monitoring

---
# k6 CronJob for regular load tests
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-daily-test
  namespace: monitoring
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        spec:
          serviceAccountName: k6
          restartPolicy: Never
          containers:
            - name: k6
              image: grafana/k6:0.49.0
              command: ["k6", "run", "/scripts/betting-engine-test.js"]
              env:
                - name: BASE_URL
                  value: "http://betting-engine.production.svc.cluster.local:8080"
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: 2000m
                  memory: 2Gi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
          volumes:
            - name: scripts
              configMap:
                name: k6-scripts
                defaultMode: 0755
